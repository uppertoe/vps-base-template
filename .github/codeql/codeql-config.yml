name: "CodeQL config"

# The scripts/server/aws-*-setup.py helpers are LOCAL operator
# credential-provisioning tools, shipped to the server repos as shims: they run
# on the admin's laptop with an AWS admin profile, and their whole job is to
# mint IAM access keys or SMTP credentials and hand them to the operator for the
# gitignored, mode-600 secret stores (backup/config.env, ansible/hosts,
# secrets/*.sops). CodeQL's "clear-text storage/logging of sensitive
# information" rules treat that intended behaviour as a vulnerability, which is
# noise for this class of tool (not runtime, not processing untrusted input).
# The server-instance-template carried the same exclusion for the same files
# before they moved here (server-files/.github/codeql/codeql-config.yml).
paths-ignore:
  - scripts/server/aws-backup-setup.py
  - scripts/server/aws-logs-setup.py
  - scripts/server/aws-ses-setup.py
