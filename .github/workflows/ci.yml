name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (shellcheck, python, playbook syntax)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Every operational shell script the roles install, plus repo tooling
      # (sh/bash shebangs only — audit-notify is python, checked below).
      - name: Shellcheck role scripts and repo tooling
        run: |
          set -euo pipefail
          files="$(git ls-files 'ansible/roles/*/files/*' 'scripts/*.sh' 'backup/tests/integration/*.sh' 'docker/*.sh' \
            | while read -r f; do head -n1 "$f" | grep -qE '^#!.*\b(ba)?sh\b' && echo "$f" || true; done)"
          echo "$files"
          # shellcheck disable=SC2086
          shellcheck $files

      - name: Python compile checks
        run: |
          python3 -m py_compile ansible/files/compose-audit/check-compose-hardening.py
          python3 -m py_compile ansible/roles/notify/files/audit-notify

      - name: Compose-audit control unit checks
        run: python3 ansible/files/compose-audit/test_check_compose_hardening.py

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install ansible-core
        run: python -m pip install --quiet ansible-core==2.19.11

      - name: Playbook syntax checks
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml >/dev/null
          ansible-playbook --syntax-check \
            ansible/bootstrap.yml ansible/site-first-run.yml ansible/site-quick.yml \
            ansible/audit-all.yml ansible/audit-openscap.yml ansible/audit-docker.yml \
            ansible/audit-compose.yml ansible/audit-lynis.yml ansible/audit-vuln.yml

  molecule-default:
    name: Molecule Default
    runs-on: ubuntu-latest
    env:
      ANSIBLE_HOME: /tmp/ansible
      XDG_CACHE_HOME: /tmp/.cache
      ANSIBLE_LOCAL_TEMP: /tmp/ansible/tmp
      ANSIBLE_REMOTE_TEMP: /tmp/ansible/tmp
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core==2.19.11
          python -m pip install -r requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run Molecule default scenario
        run: molecule test

  molecule-backup:
    name: Molecule Backup
    runs-on: ubuntu-latest
    env:
      ANSIBLE_HOME: /tmp/ansible
      XDG_CACHE_HOME: /tmp/.cache
      ANSIBLE_LOCAL_TEMP: /tmp/ansible/tmp
      ANSIBLE_REMOTE_TEMP: /tmp/ansible/tmp
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core==2.19.11
          python -m pip install -r requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run Molecule backup scenario
        run: molecule test -s backup

  backup-integration:
    name: Backup Integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install restic
        run: |
          sudo apt-get update
          sudo apt-get install -y restic

      - name: Run backup integration tests
        run: bash backup/tests/integration/run_tests.sh
