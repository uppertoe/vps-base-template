name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (shellcheck, python, playbook syntax)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every operational shell script the roles install, plus repo tooling
      # (sh/bash shebangs only — audit-notify is python, checked below).
      - name: Shellcheck role scripts and repo tooling
        run: |
          set -euo pipefail
          files="$(git ls-files 'ansible/roles/*/files/*' 'scripts/*.sh' 'backup/tests/integration/*.sh' 'docker/*.sh' 'docker/tests/*.sh' \
            | while read -r f; do head -n1 "$f" | grep -qE '^#!.*\b(ba)?sh\b' && echo "$f" || true; done)"
          echo "$files"
          # shellcheck disable=SC2086
          shellcheck $files

      - name: Python compile checks
        run: |
          python3 -m py_compile ansible/files/compose-audit/check-compose-hardening.py
          python3 -m py_compile ansible/roles/notify/files/audit-notify
          python3 -m py_compile ansible/roles/deploy-user/files/vps-secrets-render

      - name: Compose-audit control unit checks
        run: python3 ansible/files/compose-audit/test_check_compose_hardening.py

      # The Caddy renderer: the access-log token filter (same regex in the
      # per-site and global blocks, run through Go's RE2 against the token
      # shapes in use) and the route lint fixtures.
      - name: Renderer checks
        run: bash docker/tests/test-render-caddy-routes.sh

      # The secrets render step and the server-repo CI guard (docs/13-secrets.md).
      # The real-encryption tests need sops and age-keygen: sops is the pinned,
      # checksum-verified release the deploy-user role installs (version and
      # checksum read from the role's defaults, so the two cannot drift), and
      # age comes from the Ubuntu archive as on the servers.
      - name: Secrets checks
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq age >/dev/null
          defaults=ansible/roles/deploy-user/defaults/main.yml
          v="$(sed -n 's/^deploy_secrets_sops_version: "\(.*\)"$/\1/p' "$defaults")"
          sum="$(grep -A3 "\"$v\":" "$defaults" | sed -n 's/.*amd64: "sha256:\([0-9a-f]*\)"$/\1/p')"
          [ -n "$v" ] && [ -n "$sum" ]
          curl -fsSL -o /tmp/sops "https://github.com/getsops/sops/releases/download/v${v}/sops-v${v}.linux.amd64"
          echo "${sum}  /tmp/sops" | sha256sum -c -
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          python3 ansible/roles/deploy-user/files/test_vps_secrets_render.py
          bash docker/tests/test-check-secrets-encrypted.sh

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install ansible-core
        run: python -m pip install --quiet ansible-core==2.19.11

      - name: Playbook syntax checks
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml >/dev/null
          ansible-playbook --syntax-check \
            ansible/bootstrap.yml ansible/site-first-run.yml ansible/site-quick.yml \
            ansible/audit-all.yml ansible/audit-openscap.yml ansible/audit-docker.yml \
            ansible/audit-compose.yml ansible/audit-lynis.yml ansible/audit-vuln.yml

  molecule-default:
    name: Molecule Default
    runs-on: ubuntu-latest
    env:
      ANSIBLE_HOME: /tmp/ansible
      XDG_CACHE_HOME: /tmp/.cache
      ANSIBLE_LOCAL_TEMP: /tmp/ansible/tmp
      ANSIBLE_REMOTE_TEMP: /tmp/ansible/tmp
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core==2.19.11
          python -m pip install -r requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run Molecule default scenario
        run: molecule test

  molecule-backup:
    name: Molecule Backup
    runs-on: ubuntu-latest
    env:
      ANSIBLE_HOME: /tmp/ansible
      XDG_CACHE_HOME: /tmp/.cache
      ANSIBLE_LOCAL_TEMP: /tmp/ansible/tmp
      ANSIBLE_REMOTE_TEMP: /tmp/ansible/tmp
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core==2.19.11
          python -m pip install -r requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run Molecule backup scenario
        run: molecule test -s backup

  backup-integration:
    name: Backup Integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install restic
        run: |
          sudo apt-get update
          sudo apt-get install -y restic

      - name: Run backup integration tests
        run: bash backup/tests/integration/run_tests.sh
