name: Compliance Audits

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  compliance-audits:
    name: OpenSCAP and Docker Audits
    runs-on: ubuntu-24.04
    # No ANSIBLE_* env here on purpose: run-ci-compliance-audits.sh defaults
    # them under $RUNNER_TEMP. They must stay OUT of /tmp and /var/tmp — the
    # play mounts both as tmpfs mid-run (os-hardening), which vaporises the
    # executing module's own payload.
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core==2.19.11
          python -m pip install -r requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run first-run playbook and audits
        run: bash scripts/run-ci-compliance-audits.sh

      - name: Render Pages site
        run: bash scripts/render-compliance-pages.sh

      - name: Upload compliance reports artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compliance-reports
          path: reports
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: compliance-site

  container-security:
    name: Container image and compose scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Resolve pinned caddy image reference
        id: img
        run: |
          ref="$(grep -oE 'caddy:2-alpine@sha256:[a-f0-9]+' docker/caddy.base.yml | head -1)"
          echo "ref=${ref:-caddy:2-alpine}" >> "$GITHUB_OUTPUT"

      - name: Prepare reports directory
        run: mkdir -p reports/container-security

      # Image CVE scan — report-only so an unfixable upstream CVE does not block
      # deploys. Findings still surface in the artifact and the step summary.
      - name: Trivy image scan (caddy)
        run: |
          docker run --rm -v "$PWD/reports/container-security:/out" aquasec/trivy:latest@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f image \
            --severity HIGH,CRITICAL --no-progress --format table \
            --output /out/trivy-caddy.txt "${{ steps.img.outputs.ref }}" || true
          docker run --rm -v "$PWD/reports/container-security:/out" aquasec/trivy:latest@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f image \
            --severity HIGH,CRITICAL --no-progress --format json \
            --output /out/trivy-caddy.json "${{ steps.img.outputs.ref }}" || true
          echo '### Trivy (caddy) HIGH/CRITICAL' >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 reports/container-security/trivy-caddy.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Dockle image best-practice lint (caddy)
        run: |
          docker run --rm -v "$PWD/reports/container-security:/out" goodwithtech/dockle:latest@sha256:eade932f793742de0aa8755406c7677cd7696f8675b6180926f7eeffa7abe6b9 \
            --format json --output /out/dockle-caddy.json "${{ steps.img.outputs.ref }}" || true

      # Static compose misconfig lint. Fails the build on HIGH findings. The four
      # excluded query IDs are accepted public-reverse-proxy exceptions documented
      # in docs/08-security-model.md (privileged ports 80/443, all-interface bind,
      # shared named volumes, and cap_add alongside cap_drop ALL). Per-container §5
      # controls are authoritatively verified on the host by audit-compose.yml.
      - name: KICS compose scan
        run: |
          docker run --rm -v "$PWD/docker:/path" -v "$PWD/reports/container-security:/out" \
            checkmarx/kics:latest@sha256:3e5a268eb8adda2e5a483c9359ddfc4cd520ab856a7076dc0b1d8784a37e2602 scan -p /path --type DockerCompose \
            --exclude-queries 8c978947-0ff6-485c-b0c2-0bfca6026466,bc2908f3-f73c-40a9-8793-c1b7d5544f79,451d79dc-0588-476a-ad03-3c7f0320abb3,ce76b7d0-9e77-464d-b86f-c5c48e03e22d \
            --report-formats json --output-name kics-compose -o /out --fail-on high

      - name: Upload container security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-security-reports
          path: reports/container-security

  deploy-pages:
    name: Publish Compliance Reports
    if: github.ref == 'refs/heads/main'
    needs: compliance-audits
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      # Pages deployment intermittently fails with "Deployment failed, try
      # again later" (three occurrences in two days, each recovered by a
      # manual rerun) — retry once automatically before failing the run.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Retry Pages deployment (platform transient)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
