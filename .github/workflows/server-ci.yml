name: Server CI

# Reusable: a server repo's .github/workflows/ci.yml calls this at the commit
# its scaffold submodule is at, so the checks a server runs are the ones its
# pinned scaffold ships. Every script below is run from the caller's checkout
# through its scripts/ shims (scaffold/scripts/server/). The server's choices
# come from its .scaffold-server.yml. See docs/14-server-tooling.md.

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  # All the sub-minute checks share one runner: GitHub bills every job's
  # runtime rounded UP to a whole minute.
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    outputs:
      gateway_chain: ${{ steps.cfg.outputs.gateway_chain }}
      gateway_ref: ${{ steps.cfg.outputs.gateway_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Sync scaffold submodule
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Read this server's choices (.scaffold-server.yml)
        id: cfg
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re, pathlib
          text = pathlib.Path(".scaffold-server.yml").read_text() if pathlib.Path(".scaffold-server.yml").exists() else ""
          def get(key, default):
              m = re.search(rf"^{key}:\s*([^\s#]+)", text, re.M)
              return m.group(1) if m else default
          print(f"gateway_chain={get('gateway_chain', 'false')}")
          print(f"gateway_ref={get('gateway_ref', '')}")
          print(f"image_provenance={get('image_provenance', 'false')}")
          print(f"secrets_sops={get('secrets_sops', 'false')}")
          PY
          cat "$GITHUB_OUTPUT"

      # The server's copies of the shared files must be the scaffold's.
      - name: Check the shared files match the scaffold
        run: bash scripts/check-server-files.sh

      - name: Run template consistency checks
        run: bash scripts/check-template-consistency.sh

      # Supply-chain gate: every compose image must be pinned by digest.
      - name: Verify all images are pinned by digest
        run: bash scripts/check-image-pins.sh

      # Secrets live in secrets/*.sops (docs/13-secrets.md): nothing under
      # secrets/ may be plaintext, and no env file may be tracked.
      - name: Verify secrets are encrypted
        if: steps.cfg.outputs.secrets_sops == 'true'
        run: bash scaffold/docker/check-secrets-encrypted.sh

      # Guards the auth lynchpin: the (protected) snippet in apps/auth/auth.caddy
      # must strip client-supplied Remote-* headers, redirect unauthenticated
      # requests, and scope protection by path. Uses a mock auth.
      - name: Verify forward_auth header-stripping and path scoping
        if: hashFiles('apps/auth/auth.caddy') != ''
        run: bash scripts/ci-forward-auth-test.sh

      - name: Log in to GHCR
        if: steps.cfg.outputs.image_provenance == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Surface the git commit each first-party image was built from; fail on
      # a digest built from a commit that is not in its source repo.
      - name: Verify first-party image provenance
        if: steps.cfg.outputs.image_provenance == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-image-provenance.sh

  # The gateway's end-to-end suite, run against THIS server's guard snippets.
  gateway-chain:
    name: Gateway Chain
    runs-on: ubuntu-latest
    needs: static-checks
    if: needs.static-checks.outputs.gateway_chain == 'true'
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the gateway's suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: uppertoe/vps-scaffold-auth
          ref: ${{ needs.static-checks.outputs.gateway_ref }}
          path: .gateway
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: .gateway/go.sum

      - name: Test this server's guard snippets end to end
        env:
          E2E_AUTH_CADDY: ${{ github.workspace }}/apps/auth/auth.caddy
        run: .gateway/scripts/e2e.sh

  compose-smoke:
    name: Compose Smoke
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Sync scaffold submodule
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule sync --recursive
          git submodule update --init --recursive

      # The per-app proxy-network wiring relies on Compose include-merge of
      # partial service stanzas, which the runner's bundled compose predates.
      # Install the same docker-compose-plugin production hosts get.
      - name: Install current docker-compose-plugin (match production)
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
            | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q docker-compose-plugin
          docker compose version

      - name: Run compose smoke test
        run: bash scripts/ci-compose-smoke-test.sh
