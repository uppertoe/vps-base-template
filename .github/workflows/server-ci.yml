name: Server CI

# Reusable: a server repo's .github/workflows/ci.yml calls this at the commit
# its scaffold submodule is at, so the checks a server runs are the ones its
# pinned scaffold ships. Every script below is run from the scaffold submodule
# directly (scaffold/scripts/server/) against the caller's checkout, never
# through the server's scripts/ shims: the shims are files the drift check
# compares, and a shim edited in the pull request must not be what runs the
# drift check (2026-11-03 review, B-M7). The server's choices come from its
# .scaffold-server.yml, validated by that check before they are read. See
# docs/14-server-tooling.md.

on:
  workflow_call:
    secrets:
      GHCR_READ_TOKEN:
        description: read:packages token for private first-party images (optional)
        required: false

permissions:
  contents: read
  packages: read

env:
  SERVER_ROOT: ${{ github.workspace }}

jobs:
  # All the sub-minute checks share one runner: GitHub bills every job's
  # runtime rounded UP to a whole minute.
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    outputs:
      gateway_chain: ${{ steps.cfg.outputs.gateway_chain }}
      gateway_ref: ${{ steps.cfg.outputs.gateway_ref }}
      gateway_changed: ${{ steps.changes.outputs.gateway_changed }}
    steps:
      # Full history: the secret scan reads every commit, and the change check
      # below compares against the base.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # A server repo is the live config for a box, so every push and pull
      # request is scanned. The scan runs here rather than in a job of its
      # own because GitHub bills each job at least a whole minute, and the
      # scan takes seconds. secret-scan.yml keeps the weekly and on-demand
      # runs. Runs before the submodule is checked out, so only the server's
      # own history is read.
      - name: Scan history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact -v

      # The gateway suite tests apps/auth/auth.caddy at gateway_ref, so it
      # needs to run only when one of those, the CI caller or the scaffold
      # changes. Anything this step cannot work out runs the suite.
      - name: Decide whether the gateway suite needs to run
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          changed=true
          case "$EVENT" in
            pull_request) base="$PR_BASE"; range="$PR_BASE...HEAD" ;;
            push)         base="$PUSH_BEFORE"; range="$PUSH_BEFORE..HEAD" ;;
            *)            base="" ;;
          esac
          if [ -n "$base" ] && [ "$base" != 0000000000000000000000000000000000000000 ] \
             && git cat-file -e "$base^{commit}" 2>/dev/null \
             && files="$(git diff --name-only "$range")"; then
            if printf '%s\n' "$files" | grep -qE '^(apps/auth/|\.scaffold-server\.yml$|\.github/workflows/ci\.yml$|scaffold$)'; then
              changed=true
            else
              changed=false
            fi
          fi
          echo "gateway_changed=$changed" >> "$GITHUB_OUTPUT"
          echo "gateway_changed=$changed"

      - name: Sync scaffold submodule
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule sync --recursive
          git submodule update --init --recursive

      # The server's copies of the shared files must be the scaffold's, and
      # .scaffold-server.yml must hold values the steps below can act on.
      - name: Check the shared files match the scaffold
        run: bash scaffold/scripts/server/check-server-files.sh

      - name: Read this server's choices (.scaffold-server.yml)
        id: cfg
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re, pathlib
          text = pathlib.Path(".scaffold-server.yml").read_text() if pathlib.Path(".scaffold-server.yml").exists() else ""
          def get(key, default):
              m = re.search(rf"^{key}:\s*([^\s#]+)", text, re.M)
              return m.group(1) if m else default
          print(f"gateway_chain={get('gateway_chain', 'false')}")
          print(f"gateway_ref={get('gateway_ref', '')}")
          print(f"image_provenance={get('image_provenance', 'false')}")
          print(f"secrets_sops={get('secrets_sops', 'false')}")
          PY
          cat "$GITHUB_OUTPUT"

      - name: Run template consistency checks
        run: bash scaffold/scripts/server/check-template-consistency.sh

      # Supply-chain gate: every compose image must be pinned by digest.
      - name: Verify all images are pinned by digest
        run: bash scaffold/scripts/server/check-image-pins.sh

      # Secrets live in secrets/*.sops (docs/13-secrets.md): nothing under
      # secrets/ may be plaintext, and no env file may be tracked.
      - name: Verify secrets are encrypted
        if: steps.cfg.outputs.secrets_sops == 'true'
        run: bash scaffold/docker/check-secrets-encrypted.sh

      # Guards the auth lynchpin: the (role) snippet in apps/auth/auth.caddy
      # must strip client-supplied Remote-* headers, keep the session cookie
      # from the app, redirect unauthenticated requests, and scope protection
      # by path. Uses a mock auth.
      - name: Verify the role guard's header stripping and path scoping
        if: hashFiles('apps/auth/auth.caddy') != ''
        run: bash scaffold/scripts/server/ci-forward-auth-test.sh

      - name: Log in to GHCR
        if: steps.cfg.outputs.image_provenance == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GHCR_READ_TOKEN (a read:packages token, as the Renovate runner
          # holds) reads private first-party packages, which this repository's
          # own token can read only when each package grants it access.
          password: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}

      # Surface the git commit each first-party image was built from; fail on
      # a digest built from a commit that is not in its source repo.
      - name: Verify first-party image provenance
        if: steps.cfg.outputs.image_provenance == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scaffold/scripts/server/check-image-provenance.sh

  # The gateway's end-to-end suite, run against THIS server's guard snippets.
  gateway-chain:
    name: Gateway Chain
    runs-on: ubuntu-latest
    needs: static-checks
    if: needs.static-checks.outputs.gateway_chain == 'true' && needs.static-checks.outputs.gateway_changed == 'true'
    env:
      GOTOOLCHAIN: local
    steps:
      # Neither checkout needs to write back, so neither keeps a token in its
      # git configuration while the gateway's suite runs.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out the gateway's suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: uppertoe/vps-scaffold-auth
          ref: ${{ needs.static-checks.outputs.gateway_ref }}
          path: .gateway
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: .gateway/go.mod
          cache-dependency-path: .gateway/go.sum

      - name: Test this server's guard snippets end to end
        env:
          E2E_AUTH_CADDY: ${{ github.workspace }}/apps/auth/auth.caddy
        run: .gateway/scripts/e2e.sh

  compose-smoke:
    name: Compose Smoke
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Sync scaffold submodule
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule sync --recursive
          git submodule update --init --recursive

      # The per-app proxy-network wiring relies on Compose include-merge of
      # partial service stanzas, which the runner's bundled compose predates.
      # Install the same docker-compose-plugin production hosts get.
      - name: Install current docker-compose-plugin (match production)
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
            | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q docker-compose-plugin
          docker compose version

      # Boots Caddy and the data tier, rehearses database image upgrades, and
      # checks the CIS Docker section 5 block twice: as declared, over every
      # service in the resolved compose config, and at runtime on what it
      # started.
      - name: Run compose smoke test
        run: bash scaffold/scripts/server/ci-compose-smoke-test.sh
