name: Server container security

# Reusable: a server repo's .github/workflows/container-security.yml calls this
# at the commit its scaffold submodule is at. See docs/14-server-tooling.md.

on:
  workflow_call:
    secrets:
      GHCR_READ_TOKEN:
        description: read:packages token for private first-party images (optional)
        required: false

permissions:
  contents: read
  packages: read
  pull-requests: read
  checks: read

jobs:
  container-security:
    name: App image and compose scan
    runs-on: ubuntu-latest
    steps:
      # A push to main that is the merge of a pull request whose own scan
      # passed is not scanned again: the pull request scanned the same compose
      # files merged onto main, and any other change on main was scanned when
      # it was pushed. A direct push, a pull request whose scan did not pass,
      # or anything this step cannot confirm (a caller that does not grant
      # pull-requests and checks: read) is scanned as before. GitHub bills
      # each scan about four minutes.
      - name: Skip a merge already scanned in its pull request
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          scan=true
          if [ "$EVENT" = push ]; then
            pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                  --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$GITHUB_SHA\")][0] | select(.) | \"\(.number) \(.head.sha)\"" 2>/dev/null || true)"
            if [ -n "$pr" ]; then
              num="${pr%% *}"; head="${pr#* }"
              ok="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?per_page=100" \
                    --jq '[.check_runs[] | select((.name | endswith("App image and compose scan")) and .conclusion == "success")] | length' 2>/dev/null || echo 0)"
              if [ "${ok:-0}" -gt 0 ]; then
                scan=false
                echo "This commit is the merge of #$num, whose own scan passed, so the scan was not repeated." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
          echo "scan=$scan" >> "$GITHUB_OUTPUT"
          echo "scan=$scan"

      - name: Check out repository
        if: steps.gate.outputs.scan == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The scaffold's pinned Caddy is the one internet-facing container on
      # every server, so it is scanned beside the apps.
      - name: Sync scaffold submodule
        if: steps.gate.outputs.scan == 'true'
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Prepare reports directory
        if: steps.gate.outputs.scan == 'true'
        run: mkdir -p reports/container-security

      # Private first-party images need a registry login or Trivy cannot pull
      # them. GHCR_READ_TOKEN is a read:packages PAT; without it, fall back to
      # the repo's own token, which reaches the packages that grant it access.
      - name: Log in to ghcr.io
        if: steps.gate.outputs.scan == 'true'
        env:
          TOKEN: ${{ secrets.GHCR_READ_TOKEN || github.token }}
          USER: ${{ secrets.GHCR_READ_TOKEN && 'uppertoe' || github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$USER" --password-stdin

      # Image CVE scan of every app image and the scaffold's Caddy: report-only
      # so an unfixable upstream CVE does not block deploys. The summary leads
      # with a per-image count table so findings cannot hide behind a green
      # tick, and an image Trivy could not scan is flagged, not skipped silently.
      - name: Trivy image scan (app images and the proxy)
        if: steps.gate.outputs.scan == 'true'
        run: |
          images="$(grep -rhoE 'image:\s*\S+' apps/*/docker-compose.yml scaffold/docker/caddy.base.yml | awk '{print $2}' | sort -u)"
          {
            echo "### Trivy HIGH/CRITICAL by image"
            echo
            echo "| Image | High | Critical | Fixable |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for img in $images; do
            safe="$(echo "$img" | tr '/:@' '___')"
            short="${img%@*}"
            if docker run --rm -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
                -v "$PWD/reports/container-security:/out" aquasec/trivy:latest@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image \
                --severity HIGH,CRITICAL --no-progress --format json \
                --output "/out/trivy-${safe}.json" "$img"; then
              jq -r --arg img "$short" '[.Results[]?.Vulnerabilities[]?] | unique_by(.VulnerabilityID + .PkgName) as $v
                | "| \($img) | \([$v[] | select(.Severity == "HIGH")] | length) | \([$v[] | select(.Severity == "CRITICAL")] | length) | \([$v[] | select(.Status == "fixed")] | length) |"' \
                "reports/container-security/trivy-${safe}.json" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning title=Trivy scan failed::${short} could not be scanned (registry access?)"
              echo "| ${short} | — | — | scan failed |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # Static compose misconfig lint of every app. Fails on HIGH. Excluded
      # query IDs are the accepted public-reverse-proxy exceptions documented
      # in docs/08-security-model.md.
      - name: KICS compose scan (apps)
        if: steps.gate.outputs.scan == 'true'
        run: |
          docker run --rm -v "$PWD/apps:/path" -v "$PWD/reports/container-security:/out" \
            checkmarx/kics:latest@sha256:49ccc54b6ae7f5d5fc95e96f8f95c18c57f3bba047ab611a03d80792bdff6757 scan -p /path --type DockerCompose \
            --exclude-queries 8c978947-0ff6-485c-b0c2-0bfca6026466,bc2908f3-f73c-40a9-8793-c1b7d5544f79,451d79dc-0588-476a-ad03-3c7f0320abb3,ce76b7d0-9e77-464d-b86f-c5c48e03e22d \
            --report-formats json --output-name kics-apps -o /out --fail-on high

      - name: Upload container security reports
        if: always() && steps.gate.outputs.scan == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: container-security-reports
          path: reports/container-security
