# gitleaks config — extends the built-in ruleset, allowlists paths that carry
# no real secrets. Keep this list minimal; a new entry is a claim that the path
# is safe forever.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures and *.example templates contain no real credentials"
paths = [
  '''molecule/.*/fixtures/.*''',
  '''.*\.env\.example$''',
  '''ansible/inventory/production\.example$''',
]
# GitHub's published web-flow signing key fingerprints: public key material,
# named in the deploy-user defaults and UPGRADING.md as the trust anchor's
# allow-list. The generic-api-key rule otherwise flags the 40 hex characters.
regexes = [
  '''968479A1AFF927E37D1A566BB5690EEEBB952194''',
  '''5DE3E0509C47EA3CF04A42D34AEE18F83AFDEB23''',
]
