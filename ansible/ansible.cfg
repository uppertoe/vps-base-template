[defaults]
roles_path = roles
collections_path = ~/.ansible/collections
# Fail a wedged connection attempt after 60s rather than the 10s default
# tripping on a slow route, or hanging forever on a dead one.
timeout = 60

[ssh_connection]
# Budget-VPS routes drop SSH channels under way. Learned live (2026-07-05,
# a site-quick run against a US host): without keepalives a dropped channel
# hangs the play FOREVER mid-task, and per-task sftp transfers are the first
# thing the flaky route kills.
#
# - pipelining: modules travel over the exec channel — no per-task sftp at
#   all, and roughly half the round-trips (needs no requiretty in sudoers;
#   Ubuntu default is fine).
# - ServerAlive*: a dead channel errors out in ~60s instead of hanging.
# - retries: ansible then retries the connection instead of failing the play.
pipelining = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15 -o ServerAliveCountMax=4
retries = 5
