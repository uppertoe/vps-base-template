---
# audit-docker.yml — CIS Docker Benchmark audit via docker/docker-bench-security
#
# Docker's official benchmark tool. Checks the running Docker daemon, images,
# containers, and runtime against the CIS Docker Benchmark controls.
#
# Source: https://github.com/docker/docker-bench-security
#
# Usage:
#   standalone: ansible-playbook -i ansible/inventory/myserver ansible/audit-docker.yml
#   scaffold:   ansible-playbook -i ansible/hosts scaffold/ansible/audit-docker.yml
#
# Reports are saved locally relative to the playbook path so they land in a
# repo-root reports/ directory in either layout.
#
# Unlike the OS audit tools, this one IS meaningful in a container to some
# extent — but run it on a real server with your actual running containers
# for useful results.

- name: Docker CIS Benchmark audit
  hosts: all
  gather_facts: true
  become: true

  vars:
    local_reports_root: >-
      {{
        (playbook_dir | dirname | dirname)
        if (playbook_dir | dirname | basename) == 'scaffold'
        else (playbook_dir | dirname)
      }}
    local_report_dir: "{{ local_reports_root }}/reports/docker-bench-{{ inventory_hostname }}-{{ ansible_facts['date_time']['date'] }}"
    # The benchmark runs as root on a production host, so it is pinned to a
    # commit (a commit id is a hash of the whole tree) like every other
    # third-party artefact the scaffold fetches. Renovate proposes a bump when
    # upstream master moves (renovate.json5, "docker-bench-security commit").
    # renovate: datasource=git-refs depName=https://github.com/docker/docker-bench-security branch=master
    docker_bench_commit: "154869da6418089decf7e1ab0cfca0e1cdfc5c49"
    # Accounts that may hold docker-group membership, for check 1.1.2 (only
    # trusted users control the daemon): the admin account where it keeps
    # direct docker access, and the deploy account only in the default model.
    docker_bench_trusted_users: >-
      {{
        ([deploy_admin_user | default('admin')] if (deploy_allow_direct_docker_for_admin | default(true) | bool) else [])
        + ([deploy_user | default('deploy')] if not (deploy_restricted_mode | default(false) | bool) else [])
      }}

  tasks:
    - name: Install git (required to clone docker-bench-security)
      ansible.builtin.apt:
        name: git
        state: present

    - name: Clone docker-bench-security at the pinned commit
      ansible.builtin.git:
        repo: https://github.com/docker/docker-bench-security.git
        dest: /opt/docker-bench-security
        version: "{{ docker_bench_commit }}"
        force: true

    # -l names the text log; the tool writes its JSON beside it as <log>.json.
    # -u is the trusted docker-user list for check 1.1.2.
    - name: Run docker-bench-security
      ansible.builtin.shell:
        cmd: >-
          bash docker-bench-security.sh
          -l /tmp/docker-bench.log
          {% if docker_bench_trusted_users | length > 0 %}-u {{ docker_bench_trusted_users | join(',') }}{% endif %}
          2>/dev/null
        chdir: /opt/docker-bench-security
      register: bench_result
      changed_when: false
      # Non-zero exit is normal when warnings/failures are found
      failed_when: false

    - name: Print summary (WARN and FAIL lines)
      ansible.builtin.debug:
        msg: >-
          {{
            bench_result.stdout_lines
            | select('match', '.*(WARN|FAIL).*')
            | list
          }}

    - name: Ensure local report directory exists
      ansible.builtin.file:
        path: "{{ local_report_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    - name: Fetch text log
      ansible.builtin.fetch:
        src: /tmp/docker-bench.log
        dest: "{{ local_report_dir }}/docker-bench.log"
        flat: true

    - name: Fetch JSON output
      ansible.builtin.fetch:
        src: /tmp/docker-bench.log.json
        dest: "{{ local_report_dir }}/docker-bench.json"
        flat: true

    - name: Remind how to read results
      ansible.builtin.debug:
        msg:
          - "Full log: {{ local_report_dir }}/docker-bench.log"
          - "Each line references a CIS Docker Benchmark control number"
          - "e.g. [WARN] 2.1 means CIS Docker Benchmark section 2.1"
          - "Reference: https://github.com/docker/docker-bench-security"
          - "CIS Docker Benchmark PDF: https://www.cisecurity.org/benchmark/docker"

    - name: Clean up cloned repo
      ansible.builtin.file:
        path: /opt/docker-bench-security
        state: absent
