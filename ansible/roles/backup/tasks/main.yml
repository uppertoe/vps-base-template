---
# =============================================================================
# backup role — Install and configure the database backup system.
# =============================================================================
#
# Prerequisites:
#   - backup/config.env must exist in your server repo (copy from config.env.example).
#   - At least one backup/services/*.env must exist (copy from services/service.env.example).
#
# After running this role:
#   - Scripts are at /opt/backup/backup.sh and /opt/backup/restore.sh.
#   - Config is at /etc/restic/config.env and /etc/restic/services/*.env.
#   - backup.timer runs at the configured backup schedule (hourly by default).
#   - backup-verify.timer runs periodic repository checks on an off-hour weekly schedule by default.
#   - Run `systemctl start backup.service` to trigger a backup immediately.
# =============================================================================

# ---------------------------------------------------------------------------
# System dependencies
# ---------------------------------------------------------------------------

- name: Install system dependencies
  ansible.builtin.apt:
    name:
      - bzip2
      - ca-certificates
      - curl
      - gnupg
      - msmtp
      - python3
    state: present
    update_cache: true

# ---------------------------------------------------------------------------
# Install restic
# ---------------------------------------------------------------------------

- name: Check installed restic version
  ansible.builtin.command: restic version
  register: backup_restic_installed
  changed_when: false
  failed_when: false

- name: Install restic {{ backup_restic_version }}
  when: >-
    backup_restic_installed.rc != 0 or
    backup_restic_version not in backup_restic_installed.stdout
  block:
    - name: Resolve restic release architecture and checksum
      ansible.builtin.set_fact:
        backup_restic_arch: "{{ ansible_facts['architecture'] | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}"
        backup_restic_checksum: >-
          {{
            backup_restic_checksums
            .get(backup_restic_version, {})
            .get(ansible_facts['architecture'] | replace('x86_64', 'amd64') | replace('aarch64', 'arm64'), '')
          }}

    - name: Fail when no restic checksum is pinned for this platform
      ansible.builtin.fail:
        msg: "No pinned restic checksum for version {{ backup_restic_version }} arch {{ backup_restic_arch }}"
      when: backup_restic_checksum | length == 0

    - name: Download restic binary
      ansible.builtin.get_url:
        url: >-
          https://github.com/restic/restic/releases/download/v{{ backup_restic_version }}/restic_{{ backup_restic_version }}_linux_{{ backup_restic_arch }}.bz2
        dest: /tmp/restic.bz2
        mode: "0644"
        checksum: "{{ backup_restic_checksum }}"

    - name: Decompress restic
      ansible.builtin.shell: bunzip2 -c /tmp/restic.bz2 > /usr/local/bin/restic.tmp
      changed_when: true

    - name: Install restic binary
      ansible.builtin.copy:
        src: /usr/local/bin/restic.tmp
        dest: /usr/local/bin/restic
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Remove temporary restic files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/restic.bz2
        - /usr/local/bin/restic.tmp

# ---------------------------------------------------------------------------
# Install backup scripts
# ---------------------------------------------------------------------------

- name: Create scripts directory
  ansible.builtin.file:
    path: "{{ backup_scripts_dest }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Install backup.sh
  ansible.builtin.copy:
    src: backup.sh
    dest: "{{ backup_scripts_dest }}/backup.sh"
    owner: root
    group: root
    mode: "0750"

- name: Install restore.sh
  ansible.builtin.copy:
    src: restore.sh
    dest: "{{ backup_scripts_dest }}/restore.sh"
    owner: root
    group: root
    mode: "0750"

- name: Install restore-drill.sh
  ansible.builtin.copy:
    src: restore-drill.sh
    dest: "{{ backup_scripts_dest }}/restore-drill.sh"
    owner: root
    group: root
    mode: "0750"

- name: Create restore drill report directory
  ansible.builtin.file:
    path: /var/lib/backup-drill
    state: directory
    owner: root
    group: root
    mode: "0750"

# ---------------------------------------------------------------------------
# Deploy configuration
# ---------------------------------------------------------------------------

- name: Create /etc/restic directory
  ansible.builtin.file:
    path: "{{ backup_config_dest }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create /etc/restic/services directory
  ansible.builtin.file:
    path: "{{ backup_config_dest }}/services"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create restic cache directory
  ansible.builtin.file:
    path: /var/cache/restic
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deploy global config (config.env)
  ansible.builtin.copy:
    src: "{{ backup_config_src }}/config.env"
    dest: "{{ backup_config_dest }}/config.env"
    owner: root
    group: root
    mode: "0600"

- name: Find service env files in server repo
  ansible.builtin.find:
    paths: "{{ backup_config_src }}/services"
    patterns: "*.env"
    file_type: file
  register: backup_service_files
  delegate_to: localhost
  become: false

- name: Deploy service configs
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ backup_config_dest }}/services/{{ item.path | basename }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ backup_service_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

# ---------------------------------------------------------------------------
# Systemd units
# ---------------------------------------------------------------------------

- name: Install backup.service
  ansible.builtin.copy:
    src: backup.service
    dest: /etc/systemd/system/backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install backup.timer
  ansible.builtin.template:
    src: backup.timer.j2
    dest: /etc/systemd/system/backup.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable and start backup timer
  ansible.builtin.systemd:
    name: backup.timer
    enabled: true
    state: started
    daemon_reload: true
  tags:
    - molecule-notest

- name: Install backup-verify.service
  ansible.builtin.copy:
    src: backup-verify.service
    dest: /etc/systemd/system/backup-verify.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install backup-verify.timer
  ansible.builtin.template:
    src: backup-verify.timer.j2
    dest: /etc/systemd/system/backup-verify.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable and start backup verify timer
  ansible.builtin.systemd:
    name: backup-verify.timer
    enabled: true
    state: started
    daemon_reload: true
  tags:
    - molecule-notest

- name: Install restore-drill.service
  ansible.builtin.copy:
    src: restore-drill.service
    dest: /etc/systemd/system/restore-drill.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install restore-drill.timer
  ansible.builtin.template:
    src: restore-drill.timer.j2
    dest: /etc/systemd/system/restore-drill.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable and start restore drill timer
  ansible.builtin.systemd:
    name: restore-drill.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - backup_restore_drill_enabled | bool
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']
  tags:
    - molecule-notest

- name: Disable restore drill timer when turned off
  ansible.builtin.systemd:
    name: restore-drill.timer
    enabled: false
    state: stopped
  when:
    - not (backup_restore_drill_enabled | bool)
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']
  failed_when: false
  tags:
    - molecule-notest
