---
baseline_manage_apparmor_profile_modes: true
baseline_user_initialization_files_regex: '^\.[\w\- ]+$'
baseline_unneeded_packages:
  - ftp
  - tnftp
  - telnet
  - inetutils-telnet
  - rsync
  - apport
  - chrony
  - apache2
  - nginx
  - postfix
  - exim4
  - exim4-base
  - exim4-config
  - exim4-daemon-light
  - exim4-daemon-heavy
  - nullmailer
  - dma
  - sendmail
  - sendmail-bin
  - sendmail-cf

baseline_docker_audit_watch_candidates:
  - /usr/bin/docker
  - /usr/bin/dockerd
  - /usr/bin/containerd
  - /usr/bin/containerd-shim-runc-v2
  - /usr/bin/runc
  - /run/containerd
  - /var/lib/docker
  - /etc/docker
  - /etc/default/docker
  - /etc/docker/daemon.json
  - /etc/containerd/config.toml
  - /lib/systemd/system/docker.service
  - /usr/lib/systemd/system/docker.service
  - /lib/systemd/system/docker.socket
  - /usr/lib/systemd/system/docker.socket
  # NOTE: runtime sockets (/var/run/docker.sock, /run/containerd/containerd.sock)
  # are intentionally NOT watched. They do not exist when augenrules runs early
  # at boot, so a -w watch on them makes `augenrules --load` abort with
  # "No such file or directory", silently dropping every rule after it. Watch the
  # unit files and binaries instead.

# Paths AIDE must NOT file-integrity-monitor. The Debian aide.conf's root rule
# (/ 0 Full) recursively hashes the WHOLE filesystem -- including large volatile
# trees that change every hour/day from normal operation. Once a detected change
# actually alerts (see the notify role's OnFailure hook + the dailyaidecheck
# ExecStartPost that fails the unit on changes), hashing those trees floods ntfy
# with noise and buries a real tampering signal -- defeating AIDE's purpose.
#
# AIDE's job here is to tripwire the STABLE, security-relevant host: binaries and
# config in /etc, /usr, /bin, /sbin, /lib*, /boot, plus /var/spool/cron (cron
# persistence), /opt/deploy's WORKING TREE (deployed config), and /home|/root
# dotfiles like .ssh/authorized_keys -- ALL of which stay monitored. The excluded
# trees below hold only mutable state with no stable baseline to tripwire against:
#   /run          tmpfs -- ephemeral runtime state (sockets/pids), wiped at boot.
#   /tmp,/var/tmp scratch space.
#   /var/cache    regenerable caches (apt, swcatalog, restic's backup cache --
#                 rewritten on every scheduled backup).
#   /root/.cache  per-user caches (restic also caches the backup index here).
#   /var/log      append-only logs; their integrity is auditd's (immutable -e 2)
#                 and log shipping's job, not a file-hash baseline's.
#   /var/backups  daily dpkg metadata rotations.
#   /var/lib      mutable daemon/package state: docker image layers + writable
#                 container state + app volume DBs (Postgres/SQLite), apt/dpkg,
#                 systemd timer stamps, fail2ban bans, AIDE's own db, fwupd, etc.
#                 None are stable tripwire targets; an installed-backdoor still
#                 shows up in /usr|/bin (monitored) and the audit log.
#   /etc/ufw/user.rules, /etc/ufw/user6.rules
#                 ufw's DYNAMIC ruleset -- rewritten by every `ufw` command and,
#                 critically, by fail2ban's `ufw` banaction on every ban/unban of
#                 an SSH brute-forcer (constant on an internet-facing host). The
#                 admin-maintained firewall POLICY (before*.rules, after*.rules,
#                 /etc/default/ufw) is NOT excluded and stays tripwired; auditd
#                 separately logs firewall-config syscalls. Keeping fail2ban->ufw
#                 (rather than a second nft firewall) is the CIS-aligned single-
#                 firewall model.
#   /opt/deploy/.git  the deploy clone's git plumbing (objects/refs/FETCH_HEAD).
#                 It churns on every `git fetch`/`pull` -- which only updates
#                 .git, NOT the checked-out files -- so monitoring it alerts on
#                 routine fetches that change no deployed content. The WORKING
#                 TREE (/opt/deploy/<files>, incl. the scaffold submodule's
#                 checkout) stays monitored, so an actual deploy or tampering
#                 with deployed config still tripwires. Re-baseline after a real
#                 deploy that changes the working tree.
# AIDE matches by longest path, so these '!' rules override '/ 0 Full' (and the
# stock narrower include rules under these trees still win where present).
# Re-baseline (aide --init) after a legitimate change to a monitored tree, e.g.
# a deploy that touches /opt/deploy's working tree.
baseline_aide_exclude_paths:
  - /run
  - /tmp
  - /var/tmp
  - /var/cache
  - /root/.cache
  - /var/log
  - /var/backups
  - /var/lib
  - /etc/ufw/user.rules
  - /etc/ufw/user6.rules
  - /opt/deploy/.git

# Raw aide.conf rule lines (not exclusions) written verbatim into a managed block.
# Use for per-node rule overrides that '!' exclusion can't express.
#   =/ VarDir   The root '/' inode's mtime/ctime flap daily: cron runs jobs via
#               `cd / && run-parts ...`, so a daily maintenance job momentarily
#               drops a working file in '/', bumping the directory timestamp with
#               no persistent change. '=' restricts the rule to the '/' node only
#               (non-recursive), and VarDir checks owner/perms/inode/xattrs but
#               NOT mtime/ctime -- so '/' contents stay fully monitored under
#               '/ 0 Full', only the harmless timestamp flap is ignored.
#   =/etc/ld.so.cache VarFile   The linker cache is REGENERATED by ldconfig on
#               every library install -- it's a derived cache, not a stable
#               baseline (the meaningful tripwire is /etc/ld.so.conf.d, still
#               fully monitored). VarFile keeps owner/perms but drops hash/mtime.
baseline_aide_rule_overrides:
  - "=/ VarDir"
  - '=/etc/ld\.so\.cache VarFile'

# Re-baseline AIDE after apt package operations (unattended-upgrades, manual
# installs). Package upgrades legitimately change /usr/bin, /usr/lib, etc. -- the
# core paths AIDE protects, which must NOT be whitelisted. Treating apt as the
# trusted change channel (signed packages) lets a patched host stay quiet while a
# NON-package change (tampering -- runs no apt) still alerts, and auditd catches
# config-path writes in real time. Debounced: each dpkg run resets a 20-min timer
# so ONE re-baseline fires after apt settles. Set false for a stricter posture
# that requires manual `aide-rebaseline` acknowledgement of every package change.
baseline_aide_rebaseline_on_apt: true
