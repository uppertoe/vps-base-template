---
baseline_manage_apparmor_profile_modes: true
baseline_user_initialization_files_regex: '^\.[\w\- ]+$'
baseline_unneeded_packages:
  - ftp
  - tnftp
  - telnet
  - inetutils-telnet
  - rsync
  - apport
  - chrony
  - apache2
  - nginx
  - postfix
  - exim4
  - exim4-base
  - exim4-config
  - exim4-daemon-light
  - exim4-daemon-heavy
  - nullmailer
  - dma
  - sendmail
  - sendmail-bin
  - sendmail-cf

baseline_docker_audit_watch_candidates:
  - /usr/bin/docker
  - /usr/bin/dockerd
  - /usr/bin/containerd
  - /usr/bin/containerd-shim-runc-v2
  - /usr/bin/runc
  - /run/containerd
  - /var/lib/docker
  - /etc/docker
  - /etc/default/docker
  - /etc/docker/daemon.json
  - /etc/containerd/config.toml
  - /lib/systemd/system/docker.service
  - /usr/lib/systemd/system/docker.service
  - /lib/systemd/system/docker.socket
  - /usr/lib/systemd/system/docker.socket
  # NOTE: runtime sockets (/var/run/docker.sock, /run/containerd/containerd.sock)
  # are intentionally NOT watched. They do not exist when augenrules runs early
  # at boot, so a -w watch on them makes `augenrules --load` abort with
  # "No such file or directory", silently dropping every rule after it. Watch the
  # unit files and binaries instead.

# Paths AIDE must NOT file-integrity-monitor. The Debian aide.conf's root rule
# (/ 0 Full) recursively hashes the whole filesystem, which on a container host
# includes /var/lib/docker -- image layers, writable container state, and app
# volume data (Postgres/SQLite). Those change on every image pull, container
# start, deploy, and DB write, so monitoring them floods the nightly check with
# diffs and causes alert fatigue, defeating AIDE's purpose (catching tampering
# of the HOST: /etc, /usr, /bin, /boot, kernel). Image integrity is covered by
# digest pinning, not by hashing unpacked layers. AIDE matches by longest path,
# so these '!' rules override '/ 0 Full'.
# Note: /opt/deploy is intentionally NOT excluded -- it is low-churn deploy
# config worth tripwiring; re-baseline (aide --init) after a deploy.
baseline_aide_exclude_paths:
  - /var/lib/docker
  - /var/lib/containerd
