---
# Daily check that unattended-upgrades is keeping up: alerts (via vps-notify)
# when security updates are sitting unapplied, and logs a PATCH-SLA line to the
# journal either way — the evidence trail for the ISM/E8 48-hour patch clock.
common_patch_check_enabled: true
common_patch_check_schedule: "*-*-* 06:15:00"

# Unattended-upgrades installs patches, but kernel/libc fixes only take effect
# after a reboot — without a reboot policy the box runs an ever-staler kernel
# while the patch evidence says "up to date". Reboot in a quiet window when a
# patch requires it (/run/reboot-required); the notify role's vps-boot-check
# reports the outcome via ntfy either way ("Rebooted OK" / "Boot check FAILED").
#
# Automatic-Reboot-Time is read in the host's local time, and the host stays on
# UTC (server_timezone), so this value is UTC. 17:00 UTC lands at 03:00 AEST
# (UTC+10) / 04:00 AEDT (UTC+11) — the pre-dawn Melbourne quiet window in both
# seasons, and clear of the 03:17/04:23 UTC backup-verify and restore-drill
# timers. Override per instance if the service serves a different region.
# Also let unattended-upgrades apply the distro's stable-release-updates pocket
# (<codename>-updates: reviewed, phased bug-fix SRUs), not just -security.
# Ubuntu's stock allow-list omits it, so non-security fixes silently pile up
# until someone runs a play with the safe upgrade (40 packages on prod-rch-vps
# by 2026-09-05). Automatic reboot + vps-boot-check + live-restore make this
# safe enough for an unattended host; set false to stay security-only.
common_unattended_include_updates: true

common_automatic_reboot_enabled: true
common_automatic_reboot_time: "17:00"

# Safety-net defaults so the role works standalone; the scaffold's
# group_vars/all.yml is the canonical place these are set.
host_swap_encrypted: true
host_swap_crypt_name: cryptswap

# Swap is two tiers. A zram device (compressed pages held in RAM, no disk I/O,
# nothing written anywhere) takes every page first; the encrypted swapfile is
# the overflow behind it. The kernel fills the device with the higher priority
# before touching the lower one, so the loop-over-dm-crypt-over-ext4 path that
# the 2026-11-01 stop was writing to is reached only once zram is full.
#
# host_swap_zram_size is either "auto" (half of RAM, capped at 2048 MB; the
# uncompressed capacity, and zram's RAM cost is roughly a third to a half of
# it) or a size such as "1G" or "768M". zstd compresses best per CPU cycle of
# the algorithms the Ubuntu kernel offers; lz4 trades ratio for speed if the
# host is CPU-bound. A size or algorithm change applies at the next boot, or
# after `systemctl stop dev-zram0.swap && systemctl restart
# systemd-zram-setup@zram0.service` in a quiet window; the role never swaps a
# live device off.
host_swap_zram_enabled: true
host_swap_zram_size: auto
host_swap_zram_algorithm: zstd
host_swap_zram_priority: 100
# The encrypted (or plain) swapfile sits beneath zram. The priority of a
# swapfile that is already active changes at the next boot.
host_swapfile_priority: 10

common_packages:
  - curl
  - git
  - unattended-upgrades
  - apt-listchanges
  - fail2ban
  - htop
  - vim
  - ufw
