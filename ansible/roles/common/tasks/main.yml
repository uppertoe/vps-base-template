---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages to latest safe versions
  ansible.builtin.apt:
    upgrade: safe
  when: common_run_safe_upgrade | bool

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Install lightweight host monitoring packages
  ansible.builtin.apt:
    name: "{{ host_monitoring_packages }}"
    state: present
  when: host_monitoring_enabled | bool

- name: Install earlyoom
  ansible.builtin.apt:
    name: earlyoom
    state: present
  when: host_earlyoom_enabled | bool

- name: Configure automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Let unattended-upgrades apply the stable-release-updates pocket
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-updates
    content: |
      // Managed by Ansible (common role). Adds the distro's -updates pocket to
      // the unattended-upgrades allow-list (see 50unattended-upgrades).
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-updates";
      };
    owner: root
    group: root
    mode: "0644"
  when: common_unattended_include_updates | bool

- name: Remove the -updates pocket fragment when disabled
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/52unattended-upgrades-updates
    state: absent
  when: not (common_unattended_include_updates | bool)

# Patches that need a reboot must actually get one, or the running kernel
# drifts ever further from the patched one on disk. WithUsers is deliberate:
# this class of host has no interactive users to protect, and skipping the
# reboot because an admin left a stray session is the worse failure mode.
- name: Configure automatic reboot after kernel/libc updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51auto-upgrades-reboot
    content: |
      // Managed by Ansible (common role). vps-boot-check (notify role)
      // reports the post-reboot stack state via ntfy.
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "{{ common_automatic_reboot_time }}";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
    mode: "0644"
  when: common_automatic_reboot_enabled | bool

- name: Remove automatic-reboot config when disabled
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/51auto-upgrades-reboot
    state: absent
  when: not (common_automatic_reboot_enabled | bool)

- name: Install pending-security-updates check script
  ansible.builtin.copy:
    src: pending-security-updates
    dest: /usr/local/bin/pending-security-updates
    owner: root
    group: root
    mode: "0750"

- name: Install pending-security-updates.service
  ansible.builtin.copy:
    src: pending-security-updates.service
    dest: /etc/systemd/system/pending-security-updates.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install pending-security-updates.timer
  ansible.builtin.template:
    src: pending-security-updates.timer.j2
    dest: /etc/systemd/system/pending-security-updates.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable and start pending-security-updates timer
  ansible.builtin.systemd:
    name: pending-security-updates.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - common_patch_check_enabled | bool
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']
  tags:
    - molecule-notest

- name: Disable pending-security-updates timer when turned off
  ansible.builtin.systemd:
    name: pending-security-updates.timer
    enabled: false
    state: stopped
  when:
    - not (common_patch_check_enabled | bool)
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']
  failed_when: false
  tags:
    - molecule-notest

- name: Set server timezone
  community.general.timezone:
    name: "{{ server_timezone }}"

- name: Deploy fail2ban SSH jail config
  ansible.builtin.copy:
    src: fail2ban-jail-ssh.conf
    dest: /etc/fail2ban/jail.d/ssh.conf
    mode: "0644"
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

- name: Enable sysstat data collection
  ansible.builtin.lineinfile:
    path: /etc/default/sysstat
    regexp: '^ENABLED='
    line: 'ENABLED="true"'
    create: true
    mode: "0644"
  when: host_monitoring_enabled | bool

- name: Enable and start monitoring services on real hosts
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - atop
    - sysstat
  when:
    - host_monitoring_enabled | bool
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']

- name: Configure earlyoom thresholds
  ansible.builtin.copy:
    dest: /etc/default/earlyoom
    owner: root
    group: root
    mode: "0644"
    content: |
      EARLYOOM_ARGS="-m {{ host_earlyoom_min_free_mem_percent }} -s {{ host_earlyoom_min_free_swap_percent }}"
  when: host_earlyoom_enabled | bool

# The CIS remediation mounts /proc with hidepid=2, which hides every other
# process from earlyoom's DynamicUser — under real memory pressure it logs
# "Could not find a process to kill" and the box thrashes into a wedge
# instead of shedding load (seen live on prod-rch-vps, 2026-08-05).
# CAP_SYS_PTRACE exempts a process from hidepid (proc(5)); granting it
# alongside the caps the stock unit already carries is far narrower than
# running earlyoom as root, and harmless on hosts without hidepid.
- name: Ensure earlyoom drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/earlyoom.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: host_earlyoom_enabled | bool

- name: Let earlyoom see processes under hidepid
  ansible.builtin.copy:
    dest: /etc/systemd/system/earlyoom.service.d/10-hidepid.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Installed by the common role (vps-base-template). Managed by Ansible.
      # hidepid on /proc blinds earlyoom's DynamicUser to other processes;
      # CAP_SYS_PTRACE exempts it (proc(5)) so it can still pick a victim.
      [Service]
      AmbientCapabilities=
      AmbientCapabilities=CAP_KILL CAP_IPC_LOCK CAP_SYS_PTRACE
  notify:
    - Reload systemd
    - Restart earlyoom
  when: host_earlyoom_enabled | bool

- name: Enable and start earlyoom on real hosts
  ansible.builtin.systemd:
    name: earlyoom
    enabled: true
    state: started
  when:
    - host_earlyoom_enabled | bool
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']

- name: Determine managed swapfile size
  ansible.builtin.set_fact:
    common_swapfile_size_mb_effective: >-
      {%- if host_swapfile_size_mb != 'auto' -%}
      {{ host_swapfile_size_mb | int }}
      {%- elif (ansible_facts.memtotal_mb | int) <= 4096 -%}
      4096
      {%- elif (ansible_facts.memtotal_mb | int) <= 8192 -%}
      {{ ansible_facts.memtotal_mb | int }}
      {%- else -%}
      4096
      {%- endif -%}
  when:
    - host_swapfile_enabled | bool
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']

- name: Check whether managed swapfile exists
  ansible.builtin.stat:
    path: "{{ host_swapfile_path }}"
  register: common_swapfile_stat
  when:
    - host_swapfile_enabled | bool
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']

- name: Allocate managed swapfile
  ansible.builtin.command:
    cmd: "fallocate -l {{ common_swapfile_size_mb_effective }}M {{ host_swapfile_path }}"
  when:
    - host_swapfile_enabled | bool
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']
    - not common_swapfile_stat.stat.exists

- name: Set managed swapfile permissions
  ansible.builtin.file:
    path: "{{ host_swapfile_path }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - host_swapfile_enabled | bool
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']

- name: Format managed swapfile
  ansible.builtin.command:
    cmd: "mkswap {{ host_swapfile_path }}"
  when:
    - host_swapfile_enabled | bool
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']
    - not common_swapfile_stat.stat.exists

- name: Check active swap devices and files
  ansible.builtin.command:
    cmd: swapon --show=NAME --noheadings
  register: common_active_swaps
  changed_when: false
  when:
    - host_swapfile_enabled | bool
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']

# --- Plain (unencrypted) swap path -----------------------------------------

- name: Ensure managed swapfile is persistent in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^{{ host_swapfile_path | regex_escape() }}\\s+none\\s+swap\\s+sw\\s+0\\s+0$"
    line: "{{ host_swapfile_path }} none swap sw 0 0"
    state: present
  when:
    - host_swapfile_enabled | bool
    - not (host_swap_encrypted | bool)

- name: Ensure managed swapfile is active
  ansible.builtin.command:
    cmd: "swapon {{ host_swapfile_path }}"
  when:
    - host_swapfile_enabled | bool
    - not (host_swap_encrypted | bool)
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']
    - host_swapfile_path not in common_active_swaps.stdout_lines

# --- Encrypted swap path ----------------------------------------------------
# NOFAIL IS LOAD-BEARING: random-key swap is stateless by construction (its
# contents are garbage after every power cycle), so it can never be required
# to boot — but without nofail, systemd treats the crypttab entry as
# boot-critical and a transient setup race holds the whole machine at "a
# start job is running ... (no limit)". Seen live 2026-07-10: an unclean
# reboot from an IO-saturated, deep-in-swap state hung boot indefinitely on
# dev-mapper-cryptswap. Worst case with nofail is "booted without swap".
# dm-crypt over the managed swapfile with a fresh /dev/urandom key each boot
# (systemd loop-mounts file sources listed in crypttab and re-runs mkswap via
# the 'swap' option). Anything paged out of RAM — session secrets, PII — is
# unrecoverable after reboot. This is the retrofittable slice of
# encryption-at-rest; volumes/root need provider support (see the compliance
# plan, item B1).

- name: Encrypted swap
  when:
    - host_swapfile_enabled | bool
    - host_swap_encrypted | bool
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']
  block:
    - name: Install cryptsetup
      ansible.builtin.apt:
        name: cryptsetup
        state: present

    - name: Remove plain swapfile entry from fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: "^{{ host_swapfile_path | regex_escape() }}\\s+none\\s+swap\\s+"
        state: absent

    - name: Configure random-key encrypted swap in crypttab
      ansible.builtin.lineinfile:
        path: /etc/crypttab
        regexp: "^{{ host_swap_crypt_name }}\\s"
        line: "{{ host_swap_crypt_name }} {{ host_swapfile_path }} /dev/urandom swap,cipher=aes-xts-plain64,size=512,plain,nofail"
        create: true
        owner: root
        group: root
        mode: "0644"
      register: common_crypttab

    # Boot-time activation is a dedicated unit, NOT an fstab entry. The
    # fstab-generated .swap unit waits for dev-mapper-<name>.device to reach
    # 'plugged', but udev never marks a random-key plain dm-crypt mapping
    # over a loop-mounted file ready — the device job times out and the box
    # boots with zero swap, silently, every boot (prod-rch-vps ran a month
    # swapless this way and thrashed into an unreachable OOM wedge,
    # 2026-08-05). swapon against the mapper works fine; only systemd's
    # device unit is stuck. The fstab entry is actively removed so existing
    # installs also lose the 30s boot stall its device timeout caused.
    - name: Remove legacy fstab entry for encrypted swap
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: "^/dev/mapper/{{ host_swap_crypt_name }}\\s+none\\s+swap\\s+"
        state: absent

    # A provider image often ships a plain swap PARTITION (e.g. /dev/vda3) with
    # its own fstab line. Left alone it stays active next to the encrypted
    # mapping -- and at a higher priority, so the kernel prefers the
    # UNencrypted device (seen on prod-mch-vps after the 2026-09-05 reboot).
    # Comment the line out rather than delete it, so the operator can see what
    # was there, and swapoff anything still active that is not the mapping.
    - name: Disable plain swap partition entries in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^((?:/dev/(?!mapper/{{ host_swap_crypt_name }}\s)\S+|UUID=\S+|LABEL=\S+|PARTUUID=\S+)\s+none\s+swap\s+.*)$'
        replace: '# \1  # plain swap disabled by the common role: encrypted swap replaces it'

    # `swapon --show=NAME` reports the encrypted mapping by its resolved node
    # (/dev/dm-0), NOT /dev/mapper/<name> -- a name-prefix exclusion silently
    # swapped off the encrypted swap on prod-rch-vps (2026-09-06). Compare
    # resolved paths, and only ever swapoff a real partition (lsblk TYPE=part).
    - name: Deactivate plain swap partitions still active
      ansible.builtin.shell: |
        set -u
        mapper="$(readlink -f /dev/mapper/{{ host_swap_crypt_name }} 2>/dev/null || true)"
        changed=0
        for dev in $(swapon --show=NAME --noheadings); do
          [ "$dev" = "{{ host_swapfile_path }}" ] && continue
          [ -n "$mapper" ] && [ "$(readlink -f "$dev")" = "$mapper" ] && continue
          [ "$(lsblk -no TYPE "$dev" 2>/dev/null | head -n1)" = "part" ] || continue
          swapoff "$dev" && changed=1
        done
        echo "changed=$changed"
      register: common_plain_partition_swapoff
      changed_when: "'changed=1' in common_plain_partition_swapoff.stdout"

    - name: Install encrypted swap activation unit
      ansible.builtin.template:
        src: vps-cryptswap-swapon.service.j2
        dest: /etc/systemd/system/vps-cryptswap-swapon.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Enable encrypted swap activation at boot
      ansible.builtin.systemd:
        name: vps-cryptswap-swapon.service
        enabled: true
        daemon_reload: true

    # Live conversion: turn the plain swapfile off before dm-crypt claims it.
    # swapoff needs the swapped-out pages to fit back into RAM; if it fails,
    # nothing has been broken — the encrypted mapping simply activates on the
    # next reboot instead.
    - name: Deactivate plain swapfile before encrypting
      ansible.builtin.command:
        cmd: "swapoff {{ host_swapfile_path }}"
      register: common_plain_swapoff
      failed_when: false
      changed_when: common_plain_swapoff.rc == 0
      when: host_swapfile_path in common_active_swaps.stdout_lines

    - name: Warn when live swapoff could not complete
      ansible.builtin.debug:
        msg: >-
          swapoff {{ host_swapfile_path }} failed (likely not enough free RAM
          to absorb swapped pages). Encrypted swap is fully configured and will
          activate on the next reboot; the plain swapfile stays active until then.
      when:
        - common_plain_swapoff is not skipped
        - common_plain_swapoff.rc != 0

    - name: Start the encrypted swap mapping
      ansible.builtin.systemd:
        name: "systemd-cryptsetup@{{ host_swap_crypt_name }}.service"
        state: started
        daemon_reload: true
      when: >-
        common_plain_swapoff is skipped or common_plain_swapoff.rc == 0

    # The unit's ExecStart no-ops when the mapping is already swapped on, so
    # this is safe on every re-run. Skipped when the live swapoff failed —
    # the plain swapfile still holds {{ host_swapfile_path }}, and dm-crypt
    # must not claim it until the next boot.
    - name: Activate encrypted swap
      ansible.builtin.systemd:
        name: vps-cryptswap-swapon.service
        state: started
      when: common_plain_swapoff is skipped or common_plain_swapoff.rc == 0
