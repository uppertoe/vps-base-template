---
deploy_user: deploy
# errors='ignore' so a MISSING key file yields '' instead of an opaque Jinja
# templating error. The task layer asserts the value is non-empty and prints an
# actionable message (this default is a controller-side file lookup, which finds
# nothing when a site play runs ON the box with -c local — see the assert in
# tasks/main.yml and the -c local footgun note in docs/05-access-model.md).
deploy_user_public_key: "{{ lookup('file', ((ansible_ssh_private_key_file | default('~/.ssh/id_ed25519')) ~ '.pub'), errors='ignore') | default('', true) }}"

# --- Access model (docs/05-access-model.md) ---------------------------------
# Restricted mode narrows deploy from root-equivalent (NOPASSWD:ALL + docker
# group) to a wrapper-only sudo allowlist (vps-deploy / vps-app-manage /
# vps-app-logs) with no docker group. The admin account is the break-glass
# operator identity and — in restricted mode — the identity Ansible site plays
# must run as (ansible_user=admin), since deploy can no longer become root.
#
# Default stays false until the restricted path is proven on the real VPS
# (the docs/05 staged rollout); molecule converges with true so the target
# posture is what CI continuously proves. Reversible: flipping back restores
# broad sudo + the docker group on the next site run.
deploy_restricted_mode: false

deploy_admin_user: admin
# Defaults to the same public key as deploy; set a DEDICATED key in the
# inventory for a real separation of identities.
deploy_admin_public_key: "{{ deploy_user_public_key }}"
# Restricted mode is only real if the admin (sudo-capable) key differs from the
# deploy key — otherwise a single stolen key is passwordless root and the
# wrapper-only-sudo story collapses. In restricted mode, provisioning FAILS on a
# shared key unless you accept the posture explicitly here (e.g. a staging box).
deploy_admin_key_allow_shared: false
# Give admin the docker group (docs/05 docker-access option 2).
deploy_allow_direct_docker_for_admin: true

# Verb -> command map for vps-app-manage, rendered into root-owned
# /etc/vps-scaffold/app-manage.allow. The command runs via
# `docker compose exec <service> <command>`. Empty = nothing allowed.
# Example:
#   deploy_allowed_app_manage_commands:
#     migrate: "python manage.py migrate --noinput"
#     collectstatic: "python manage.py collectstatic --noinput"
deploy_allowed_app_manage_commands: {}

# --- Hands-off updates ---------------------------------------------------
# The CI-gated fast path: Renovate proposes digest/submodule bumps, repo CI
# validates, Renovate automerges, and the auto-deploy timer applies them
# (compose/Caddy layer only). Opt-in per host. The Ansible layer is
# DELIBERATELY excluded — those changes carry UPGRADING.md operator actions;
# the scaffold-drift timer alerts when they are waiting.
deploy_auto_update: false
deploy_auto_update_schedule: "*-*-* 05:15:00"
# Supply-chain gate for the deploy path: everything on the deployed branch runs
# as root (docker compose up + app hooks). When true, vps-deploy refuses to
# apply a HEAD that is not a good signature from a signer the deploy user trusts
# — so a merge that bypassed review cannot execute as root. Requires signed
# commits + a configured allowed-signers/keyring for the deploy user; off by
# default because it needs that setup. Strongly recommended once auto-deploy is
# on. See docs/05-access-model.md.
deploy_verify_signature: false
# Trust store for deploy_verify_signature — who may sign the deployed HEAD.
# Each entry is one line of git's allowed-signers format:
#   "<principal> <key-type> <base64-key>"   (principal = committer email)
# The file lands root-owned on the host, so a compromised deploy user cannot
# extend it. Generate a dedicated signing key (ssh-keygen -t ed25519) rather
# than reusing an auth key; see docs/05-access-model.md.
deploy_allowed_signers: []
# Also trust commits created by GitHub's own merge machinery (web UI and API
# merges — which is what Renovate automerge produces): GitHub signs those with
# its web-flow GPG key, fetched from github.com/web-flow.gpg at provision
# time. Leaves direct unsigned pushes as the only refused path.
deploy_trust_github_merges: true
# Weekly awareness alert when the scaffold submodule is behind upstream main.
scaffold_drift_check: true
scaffold_drift_schedule: "Mon *-*-* 07:05:00"

# --- Push-to-deploy trigger ------------------------------------------------
# Event-driven complement to the hourly auto-deploy timer: a server-repo
# GitHub workflow publishes a ping to an unguessable ntfy topic when main
# moves, and the deploy-trigger subscriber starts auto-deploy immediately
# (~2 min push-to-live for the compose/Caddy layer instead of <=1h). The ping
# carries NO authority: auto-deploy still fetches, verifies the signed HEAD,
# and skips when unchanged — a forged ping is a rate-limited no-op fetch.
# Opt-in per host; needs the bundled apps/ntfy (or any reachable ntfy) with a
# read token for the topic. See apps/ntfy in the server-repo template for the
# user/token bootstrap, and add the matching publish workflow + secret there.
deploy_push_trigger: false
# Full topic URL, e.g. "http://127.0.0.1:8080/<unguessable-topic>" when the
# box's own ntfy serves the topic (subscription never leaves the host).
deploy_push_trigger_url: ""
# ntfy token with READ access to that topic (publish uses a separate token,
# held only as a GitHub Actions secret).
deploy_push_trigger_token: ""
