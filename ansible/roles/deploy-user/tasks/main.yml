---
# =============================================================================
# deploy-user role — the deploy identity, the admin (break-glass) identity,
# and the root-owned wrapper entrypoints. See docs/05-access-model.md.
# =============================================================================

# Restricted mode's entire premise is deploy != root. If the admin key equals
# the deploy key, one stolen key authenticates the NOPASSWD:ALL admin account —
# passwordless root — and the wrapper-only sudo boundary is decorative. Fail
# early rather than ship a false posture.
- name: Refuse a shared admin/deploy key in restricted mode
  ansible.builtin.fail:
    msg: >-
      deploy_admin_public_key is identical to deploy_user_public_key while
      deploy_restricted_mode is true. A single stolen key then grants
      passwordless root via the admin account, defeating restricted mode. Set a
      dedicated admin key in the inventory, or accept the shared-key posture
      explicitly with deploy_admin_key_allow_shared: true.
  when:
    - deploy_restricted_mode | bool
    - (deploy_admin_public_key | trim) == (deploy_user_public_key | trim)
    - not (deploy_admin_key_allow_shared | default(false) | bool)
    - not (molecule_test | default(false) | bool)

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    create_home: true
    state: present

# CIS file_permissions_home_directories: 750 or stricter.
- name: Restrict deploy home directory permissions
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}"
    mode: "0750"

# deploy_user_public_key manages deploy's authorized_keys with exclusive: true,
# so an empty value would remove every key and lock the account out. Its default
# is a controller-side lookup of the connection key's .pub — which resolves to
# nothing when a site play runs ON the box (-c local, the sane path over a slow
# operator link), where the laptop's key files don't exist. Fail with an
# actionable message instead of shipping a broken authorized_keys.
- name: Assert deploy public key resolved
  ansible.builtin.assert:
    that:
      - (deploy_user_public_key | default('') | trim) | length > 0
    fail_msg: >-
      deploy_user_public_key is empty. Its default reads
      '{{ ansible_ssh_private_key_file | default("~/.ssh/id_ed25519") }}.pub' via a
      lookup on the CONTROL node, which finds nothing when the play runs ON the
      box (-c local). Set deploy_user_public_key to the literal deploy public key
      in the inventory ([servers:vars]). See docs/05-access-model.md.
    quiet: true

- name: Add SSH public key to authorized_keys
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ deploy_user_public_key }}"
    state: present
    exclusive: true  # only this key — remove all others

# Restricted mode replaces broad sudo with the wrapper allowlist. Both
# renderings go through visudo validation; the switch is reversible.
- name: Configure sudo policy for deploy user
  ansible.builtin.template:
    src: sudoers-deploy.j2
    dest: "/etc/sudoers.d/{{ deploy_user }}"
    mode: "0440"
    validate: "visudo -cf %s"

# --- Admin (break-glass operator) identity ----------------------------------

- name: Create admin user
  ansible.builtin.user:
    name: "{{ deploy_admin_user }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Restrict admin home directory permissions
  ansible.builtin.file:
    path: "/home/{{ deploy_admin_user }}"
    mode: "0750"

- name: Add SSH public key to admin authorized_keys
  ansible.posix.authorized_key:
    user: "{{ deploy_admin_user }}"
    key: "{{ deploy_admin_public_key }}"
    state: present
    exclusive: true

- name: Grant passwordless sudo to admin user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ deploy_admin_user }}"
    content: "{{ deploy_admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: "visudo -cf %s"

# The docker role also ensures this group; creating it here keeps bootstrap
# (which runs only common + deploy-user) self-contained.
- name: Ensure docker group exists for admin membership
  ansible.builtin.group:
    name: docker
    state: present
  when: deploy_allow_direct_docker_for_admin | bool

- name: Add admin user to docker group
  ansible.builtin.user:
    name: "{{ deploy_admin_user }}"
    groups: docker
    append: true
  when: deploy_allow_direct_docker_for_admin | bool

# --- Deploy tree and entrypoints ---------------------------------------------

- name: Create deploy directory for docker projects
  ansible.builtin.file:
    path: /opt/deploy
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: Create vps-scaffold config directory
  ansible.builtin.file:
    path: /etc/vps-scaffold
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Install root-owned deploy wrapper
  ansible.builtin.template:
    src: vps-deploy.j2
    dest: /usr/local/sbin/vps-deploy
    owner: root
    group: root
    mode: "0750"

# In restricted mode docker (and so `compose pull`) runs as root inside
# vps-deploy, but private-registry credentials were logged in as the deploy
# user (bootstrap flow) and live in ~deploy/.docker/config.json — root's pull
# gets "unauthorized" and every deploy of a private image fails. Propagate the
# credentials to root's docker config. Found flipping a live host with private
# GHCR images.
- name: Check for deploy-user registry credentials
  ansible.builtin.stat:
    path: "/home/{{ deploy_user }}/.docker/config.json"
  register: deploy_docker_config
  when: deploy_restricted_mode | bool

- name: Ensure root docker config directory exists
  ansible.builtin.file:
    path: /root/.docker
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - deploy_restricted_mode | bool
    - deploy_docker_config.stat.exists

- name: Propagate registry credentials to root in restricted mode
  ansible.builtin.copy:
    src: "/home/{{ deploy_user }}/.docker/config.json"
    remote_src: true
    dest: /root/.docker/config.json
    owner: root
    group: root
    mode: "0600"
  when:
    - deploy_restricted_mode | bool
    - deploy_docker_config.stat.exists

- name: Install root-owned app-manage and app-logs wrappers
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0750"
  loop:
    - vps-app-manage
    - vps-app-logs

- name: Install app-manage verb allowlist
  ansible.builtin.template:
    src: app-manage.allow.j2
    dest: /etc/vps-scaffold/app-manage.allow
    owner: root
    group: root
    mode: "0640"

- name: Install deploy helper to home directory
  ansible.builtin.template:
    src: deploy.j2
    dest: "/home/{{ deploy_user }}/deploy"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

# --- Signed-deploy trust store (deploy_verify_signature) ------------------
# vps-deploy refuses to apply a HEAD it cannot verify. Two kinds of signature
# must verify: the operator's SSH-signed commits (allowed-signers file) and
# GitHub's web-flow GPG key (web/API merge commits, incl. Renovate automerge).
# Verification runs AS ROOT inside vps-deploy, with root-owned configuration
# only (an explicit allowedSignersFile and a fixed GNUPGHOME, the deploy
# user's git config and keyring ignored), so the trust store is genuinely
# outside the deploy account's reach — a stolen deploy key cannot add a signer.

- name: Install allowed-signers file for signed deploys
  ansible.builtin.template:
    src: allowed_signers.j2
    dest: /etc/ssh/allowed_signers
    owner: root
    group: root
    mode: "0644"
  when: deploy_verify_signature | bool

# Earlier releases verified as the deploy user and pointed its ~/.gitconfig at
# the signers file. Root now passes the path explicitly, so the pointer is
# retired (it was also a deploy-writable knob over which signers file applied).
- name: Retire the deploy user's allowed-signers git pointer
  community.general.ini_file:
    path: "/home/{{ deploy_user }}/.gitconfig"
    section: 'gpg "ssh"'
    option: allowedSignersFile
    state: absent
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0640"
  when: deploy_verify_signature | bool

- name: Ensure gnupg is present for merge-commit verification
  ansible.builtin.apt:
    name: gnupg
    state: present
  when:
    - deploy_verify_signature | bool
    - deploy_trust_github_merges | bool

- name: Fetch GitHub web-flow signing key
  ansible.builtin.get_url:
    url: https://github.com/web-flow.gpg
    dest: /etc/vps-scaffold/github-web-flow.gpg
    owner: root
    group: root
    mode: "0644"
  when:
    - deploy_verify_signature | bool
    - deploy_trust_github_merges | bool

# Pin the downloaded trust anchor to GitHub's published fingerprint before it
# is imported anywhere; a tampered download must fail the play, not widen trust.
- name: Read the primary fingerprint of the downloaded web-flow key
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      gpg --batch --with-colons --show-keys /etc/vps-scaffold/github-web-flow.gpg
      | awk -F: '/^fpr:/ { print $10; exit }'
    executable: /bin/bash
  register: webflow_fpr
  changed_when: false
  when:
    - deploy_verify_signature | bool
    - deploy_trust_github_merges | bool

- name: Refuse a web-flow key with an unexpected fingerprint
  ansible.builtin.assert:
    that:
      - webflow_fpr.stdout | trim == deploy_github_webflow_fingerprint
    fail_msg: >-
      /etc/vps-scaffold/github-web-flow.gpg does not carry fingerprint
      {{ deploy_github_webflow_fingerprint }}. Refusing to import it as a deploy
      trust anchor; compare with GitHub's published key and update
      deploy_github_webflow_fingerprint only if GitHub has rotated it.
    quiet: true
  when:
    - deploy_verify_signature | bool
    - deploy_trust_github_merges | bool

- name: Create the root-owned keyring for merge-commit verification
  ansible.builtin.file:
    path: /etc/vps-scaffold/gnupg
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - deploy_verify_signature | bool
    - deploy_trust_github_merges | bool

- name: Import GitHub web-flow key into the root-owned keyring
  ansible.builtin.command:
    cmd: gpg --batch --import /etc/vps-scaffold/github-web-flow.gpg
  environment:
    GNUPGHOME: /etc/vps-scaffold/gnupg
  register: webflow_import
  changed_when: "'imported:' in webflow_import.stderr"
  when:
    - deploy_verify_signature | bool
    - deploy_trust_github_merges | bool

# --- Hands-off updates (see defaults for the model) ----------------------

- name: Install auto-deploy and scaffold-drift scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0750"
  loop:
    - auto-deploy
    - scaffold-drift-check

- name: Install auto-deploy and scaffold-drift units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - auto-deploy.service
    - auto-deploy.timer
    - scaffold-drift.service
    - scaffold-drift.timer
  notify: Reload systemd

- name: Enable or disable the auto-deploy timer
  ansible.builtin.systemd:
    name: auto-deploy.timer
    enabled: "{{ deploy_auto_update | bool }}"
    state: "{{ 'started' if deploy_auto_update | bool else 'stopped' }}"
    daemon_reload: true
  when: ansible_facts['virtualization_type'] | default('') not in ['docker', 'container', 'lxc']
  tags:
    - molecule-notest

- name: Enable or disable the scaffold-drift timer
  ansible.builtin.systemd:
    name: scaffold-drift.timer
    enabled: "{{ scaffold_drift_check | bool }}"
    state: "{{ 'started' if scaffold_drift_check | bool else 'stopped' }}"
    daemon_reload: true
  when: ansible_facts['virtualization_type'] | default('') not in ['docker', 'container', 'lxc']
  tags:
    - molecule-notest

# --- Push-to-deploy trigger (see defaults for the model) ------------------

- name: Install deploy-trigger subscriber script
  ansible.builtin.copy:
    src: deploy-trigger
    dest: /usr/local/sbin/deploy-trigger
    owner: root
    group: root
    mode: "0750"

- name: Install deploy-trigger unit
  ansible.builtin.template:
    src: deploy-trigger.service.j2
    dest: /etc/systemd/system/deploy-trigger.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Render deploy-trigger config
  ansible.builtin.template:
    src: deploy-trigger.env.j2
    dest: /etc/vps-scaffold/deploy-trigger.env
    owner: root
    group: root
    mode: "0600"
  register: deploy_trigger_conf
  no_log: true
  when: deploy_push_trigger | bool

- name: Remove deploy-trigger config when disabled
  ansible.builtin.file:
    path: /etc/vps-scaffold/deploy-trigger.env
    state: absent
  when: not deploy_push_trigger | bool

- name: Enable or disable the deploy-trigger subscriber
  ansible.builtin.systemd:
    name: deploy-trigger.service
    enabled: "{{ deploy_push_trigger | bool }}"
    state: "{{ 'started' if deploy_push_trigger | bool else 'stopped' }}"
    daemon_reload: true
  when: ansible_facts['virtualization_type'] | default('') not in ['docker', 'container', 'lxc']
  tags:
    - molecule-notest

- name: Restart deploy-trigger on config change
  ansible.builtin.systemd:
    name: deploy-trigger.service
    state: restarted
  when:
    - deploy_push_trigger | bool
    - deploy_trigger_conf is changed
    - ansible_facts['virtualization_type'] | default('') not in ['docker', 'container', 'lxc']
  tags:
    - molecule-notest
