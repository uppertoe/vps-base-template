---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  tags: molecule-notest  # apt operations in containers are OOM-prone; Docker install is not meaningful to test in Docker

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags: molecule-notest

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false
  tags: molecule-notest

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_facts['architecture'] | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present
  tags: molecule-notest

# Docker CE comes from Docker's own apt origin ("Docker"), which Ubuntu's
# stock 50unattended-upgrades does not list, so engine/containerd security
# fixes never auto-applied (prod-rch-vps sat on 29.5.3 with 29.8.0
# available, 2026-09-05). apt.conf.d fragments append to the list, so this
# leaves the distro's own allow-list untouched. daemon.json sets
# live-restore, so a dockerd restart during the upgrade keeps containers up.
- name: Let unattended-upgrades apply Docker CE updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-docker
    content: |
      // Managed by Ansible (docker role). Adds Docker's apt origin to the
      // unattended-upgrades allow-list (see 50unattended-upgrades).
      Unattended-Upgrade::Allowed-Origins {
          "Docker:${distro_codename}";
      };
    owner: root
    group: root
    mode: "0644"

- name: Install Docker CE and compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  tags: molecule-notest

- name: Create /etc/docker directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Configure Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    mode: "0644"
  notify:
    - Restart docker
    - Apply docker-aware firewall

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  # Skip inside Docker containers (Molecule) — Docker-in-Docker is fragile
  when: ansible_facts['virtualization_type'] not in ['docker', 'container']

- name: Deploy docker-prune systemd service
  ansible.builtin.copy:
    src: docker-prune.service
    dest: /etc/systemd/system/docker-prune.service
    mode: "0644"

- name: Deploy docker-prune systemd timer
  ansible.builtin.copy:
    src: docker-prune.timer
    dest: /etc/systemd/system/docker-prune.timer
    mode: "0644"

- name: Enable and start docker-prune timer
  ansible.builtin.systemd:
    name: docker-prune.timer
    enabled: true
    state: started
    daemon_reload: true
  when: ansible_facts['virtualization_type'] not in ['docker', 'container']

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present

# Restricted mode (docs/05): deploy loses ad-hoc Docker access; the root-owned
# vps-deploy / vps-app-manage wrappers are its only container path. The admin
# break-glass account keeps docker-group membership (deploy-user role).
- name: Add deploy user to docker group
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true
  when: not (deploy_restricted_mode | bool)

- name: Remove deploy user from docker group (restricted mode)
  ansible.builtin.command:
    cmd: "gpasswd -d {{ deploy_user }} docker"
  register: docker_deploy_degroup
  changed_when: docker_deploy_degroup.rc == 0
  failed_when:
    - docker_deploy_degroup.rc != 0
    - "'is not a member' not in (docker_deploy_degroup.stderr ~ docker_deploy_degroup.stdout)"
  when: deploy_restricted_mode | bool
