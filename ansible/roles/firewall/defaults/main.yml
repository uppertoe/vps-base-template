---
firewall_default_incoming_policy: deny
firewall_default_outgoing_policy: deny
firewall_default_routed_policy: deny

# The role adds a ufw rule for every port listed below and never deletes one.
# A port removed from a list keeps its rule until an operator deletes it on
# the box, for example `sudo ufw delete allow 8080/tcp` or
# `sudo ufw delete allow out 25/tcp`. `sudo ufw status numbered` lists what is
# in force. The Docker-aware chain is rebuilt from the lists on every run, so
# container traffic follows the lists at once.
firewall_allowed_tcp_ports:
  - "22"
  - "80"
  - "443"

firewall_allowed_udp_ports:
  - "443"  # HTTP/3 (QUIC)

firewall_allowed_outbound_tcp_ports:
  - "22"   # Git over SSH / deploy key pulls
  - "53"   # DNS over TCP fallback
  - "80"   # apt/http redirects
  - "443"  # HTTPS, ACME, Docker registry, S3-compatible APIs, SNS web APIs
  - "587"  # SMTP submission (STARTTLS)

firewall_allowed_outbound_udp_ports:
  - "53"   # DNS
  - "123"  # NTP

# ufw's own logging. "low" (the ufw default) writes a kernel line for every
# blocked packet: 582 `[UFW BLOCK]` lines in under two hours on a live host,
# which is journal budget spent on background internet noise and is what
# bounds on-box retention. Off by default. The rules themselves and their hit
# counters are unaffected (`ufw status verbose`, `iptables -nvL`), fail2ban
# logs its own bans from sshd, and the hourly log export carries whatever the
# journal holds. Note that with logging off, blocked connections are recorded
# nowhere: the scaffold's auditd rules do not cover netfilter. Set "low" to
# have them in the journal again at ufw's own rate limit.
host_ufw_logging: "off"

docker_firewall_enabled: true
docker_firewall_bridge_interfaces:
  - docker0
  - br+
# The host's outbound ports, less SSH: the host pulls over SSH, but no
# container needs to, and outbound SSH from a compromised container is a
# ready tunnel (2026-11-04 review; RCH's counters on this rule were zero).
docker_firewall_allowed_outbound_tcp_ports: "{{ firewall_allowed_outbound_tcp_ports | map('string') | reject('equalto', '22') | list }}"
docker_firewall_allowed_outbound_udp_ports: "{{ firewall_allowed_outbound_udp_ports }}"
