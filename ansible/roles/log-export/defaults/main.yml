---
# Off-host, tamper-evident log retention (ISM-1988: searchable ≥ 12 months;
# ISM-1815: protected from modification/deletion).
#
# Nightly: export everything new in the journal (cursor-file incremental, so
# auditd/auth/sshd/sudo and all unit logs are covered), plus the raw audit.log
# rotations and Caddy JSON access logs, into a zstd tarball whose SHA-256 is
# chained onto the previous export's hash — editing or dropping any earlier
# archive breaks the chain. The tarball is uploaded with `aws s3 cp`.
#
# The tamper-PROOF half lives bucket-side and is deliberately not something
# the box can grant itself. Create the destination with:
#   - S3 Object Lock enabled (governance/compliance mode), default retention
#     ≥ 12 months, versioning on (Object Lock requires it)
#   - a dedicated IAM user whose policy allows s3:PutObject on the prefix and
#     NOTHING else (no delete, no lifecycle, no bypass-governance)
# With that in place, a root compromise on the VPS can stop FUTURE exports
# (which the dead-man pattern of daily uploads makes visible) but cannot
# rewrite history.
#
# Opt-in: stays inert until log_export_s3_uri is set.
log_export_enabled: true
log_export_s3_uri: ""            # e.g. s3://myorg-vps-logs/prod-host1
log_export_schedule: "*-*-* 04:47:00"
log_export_state_dir: /var/lib/log-export

# Extra log file globs to include beyond the journal (find -newer incremental).
log_export_extra_paths:
  - /var/log/audit
  - /var/lib/docker/volumes/caddy_logs/_data

# Credentials for the dedicated write-only IAM user. Set in the (gitignored)
# inventory; written to /etc/vps-scaffold/log-export.env mode 0600.
log_export_aws_access_key_id: ""
log_export_aws_secret_access_key: ""
log_export_aws_region: ""
