---
# =============================================================================
# log-export role — Off-host, tamper-evident log retention (ISM-1988/1815).
# =============================================================================
#
# Inert until log_export_s3_uri is set. See defaults/main.yml for the required
# bucket shape (Object Lock + write-only IAM user) — the delete-protection
# half of the control lives bucket-side by design.
# =============================================================================

# python3-boto3 handles the S3 upload — Ubuntu 24.04 dropped awscli from the
# apt archive, and boto3 is a fraction of the footprint on a small VPS.
- name: Install export dependencies
  ansible.builtin.apt:
    name:
      - zstd
      - python3-boto3
    state: present

- name: Create state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ log_export_state_dir }}"
    - "{{ log_export_state_dir }}/pending"

- name: Create vps-scaffold config directory
  ansible.builtin.file:
    path: /etc/vps-scaffold
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Install export credentials/config
  ansible.builtin.template:
    src: log-export.env.j2
    dest: /etc/vps-scaffold/log-export.env
    owner: root
    group: root
    mode: "0600"

- name: Install log-export script
  ansible.builtin.copy:
    src: log-export.sh
    dest: /usr/local/bin/log-export.sh
    owner: root
    group: root
    mode: "0750"

- name: Install log-export.service
  ansible.builtin.template:
    src: log-export.service.j2
    dest: /etc/systemd/system/log-export.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install log-export.timer
  ansible.builtin.template:
    src: log-export.timer.j2
    dest: /etc/systemd/system/log-export.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Note when log export is unconfigured
  ansible.builtin.debug:
    msg: >-
      log_export_s3_uri is empty — off-host log export is installed but inert.
      Create an Object-Locked bucket + write-only IAM user (see the log-export
      role defaults) and set log_export_s3_uri in the inventory to enable.
  when: log_export_s3_uri | length == 0

- name: Enable and start log-export timer
  ansible.builtin.systemd:
    name: log-export.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - log_export_enabled | bool
    - log_export_s3_uri | length > 0
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']
  tags:
    - molecule-notest

- name: Disable log-export timer when unconfigured
  ansible.builtin.systemd:
    name: log-export.timer
    enabled: false
    state: stopped
  when:
    - not (log_export_enabled | bool and log_export_s3_uri | length > 0)
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']
  failed_when: false
  tags:
    - molecule-notest
