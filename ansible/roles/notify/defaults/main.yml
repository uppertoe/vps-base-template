---
# Push notifications via ntfy. Disabled until notify_ntfy_url is set (e.g. in the
# gitignored inventory). When empty, the scripts are installed but no-op.
notify_ntfy_url: ""
notify_ntfy_token: ""
notify_default_priority: high

# External dead-man's switch. The on-box ntfy cannot alert when the host itself
# is down, so a small timer pings an external monitor — silence past the
# monitor's grace period is the host-down alarm. Opt-in: empty URL installs
# nothing active.
#
# Self-hosted Gatus (recommended — set the token, pings become Bearer POSTs):
#   notify_deadman_url:   https://gatus.example/api/v1/endpoints/<group>_<name>/external?success=true
#   notify_deadman_token: <the external endpoint's token>
#   Gatus side: an external-endpoints entry with heartbeat.interval set to
#   ~3x notify_deadman_interval_min. Gatus must alert via a channel that does
#   not depend on this VPS (not the on-box ntfy).
# Healthchecks / Uptime Kuma push URLs: set the URL only (plain GET).
#
# The heartbeat is REQUIRED for a set-and-forget host: every other alert in the
# scaffold originates on the box, so "the box is down" is invisible without it.
# Provisioning fails when the URL is empty unless the gap is explicitly
# accepted with notify_deadman_accept_none: true.
notify_deadman_url: ""
notify_deadman_token: ""
notify_deadman_interval_min: 5
notify_deadman_accept_none: false

# Accept a box with NO on-box alerting (ntfy unset). Like the deadman gate,
# provisioning fails on an empty notify_ntfy_url unless this is explicitly true.
notify_alerts_accept_none: false

# On-box watchers — the "who watches the watcher" layer. All alert through
# vps-notify (ntfy) and no-op when notify_ntfy_url is unset.
#
# Disk usage: alerts on threshold transitions (once per crossing, with an
# all-clear), hourly sweep. The slow killer of unattended hosts.
notify_disk_watch_enabled: true
notify_disk_watch_warn_pct: 80
notify_disk_watch_crit_pct: 90

# Container health: unhealthy / restart-looping containers between deploys
# (deploy's --wait only proves health at deploy time). Grace before the first
# alert; cooldown before repeating it.
notify_container_watch_enabled: true
notify_container_watch_interval_min: 5
notify_container_watch_grace_secs: 600
notify_container_watch_cooldown_secs: 21600

# Post-boot report: after any (re)boot — including unattended-upgrades'
# Automatic-Reboot window — confirm the stack came back healthy ("Rebooted
# OK") or page ("Boot check FAILED").
notify_boot_check_enabled: true
notify_boot_check_deadline_secs: 600

# Monthly synthetic alert: end-to-end proof the ntfy→phone chain still works.
notify_selftest_enabled: true

# Weekly security digest: the automated log review (ISM expects logs to be
# REVIEWED, not just retained). SSH abuse, bans, sudo activity, listening-
# socket deltas, container/disk state, patch SLA, web auth denials — one ntfy
# message, plus a dated journal record as review evidence.
notify_log_digest_enabled: true

# Units whose failure should trigger a push (OnFailure=). Only units that exist
# on the host get a drop-in; the rest are skipped. dailyaidecheck failing is the
# AIDE "file integrity changed / scan errored" signal.
notify_onfailure_units:
  - auditd.service
  - docker.service
  - fail2ban.service
  - ssh.service
  - dailyaidecheck.service
  - backup.service
  - backup-verify.service
  - restore-drill.service
  - vuln-scan.service
  - pending-security-updates.service
  - log-export.service

# Kernel auto-reboot, guarded against crash loops: one automatic reboot per
# fault, then the box stays down and intact until it has proved stable again.
# See /usr/local/bin/vps-panic-guard and notify.env for the tunables.
notify_panic_guard_enabled: true
# Seconds the kernel waits before rebooting itself. Not 1: the panic text has
# to clear the serial console first, and that is the only record of the cause.
notify_panic_guard_reboot_secs: 10
# Automatic reboots allowed per fault before the box is left down for
# inspection. 1 means a crash loop can never happen.
notify_panic_guard_max_reboots: 1
# Uptime that redeems a strike and re-arms the guard.
notify_panic_guard_stable_min: 30
notify_panic_guard_on_oops: true
notify_panic_guard_on_softlockup: true
# Off by default: slow storage can block a task past hung_task_timeout_secs
# with the host otherwise fine, and a spurious reboot is worse than a stall.
notify_panic_guard_on_hung_task: false
