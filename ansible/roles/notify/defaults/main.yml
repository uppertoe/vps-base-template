---
# Push notifications via ntfy. Disabled until notify_ntfy_url is set (e.g. in the
# gitignored inventory). When empty, the scripts are installed but no-op.
notify_ntfy_url: ""
notify_ntfy_token: ""
notify_default_priority: high

# External dead-man's switch. The on-box ntfy cannot alert when the host itself
# is down, so a small timer pings an external monitor — silence past the
# monitor's grace period is the host-down alarm. Opt-in: empty URL installs
# nothing active.
#
# Self-hosted Gatus (recommended — set the token, pings become Bearer POSTs):
#   notify_deadman_url:   https://gatus.example/api/v1/endpoints/<group>_<name>/external?success=true
#   notify_deadman_token: <the external endpoint's token>
#   Gatus side: an external-endpoints entry with heartbeat.interval set to
#   ~3x notify_deadman_interval_min. Gatus must alert via a channel that does
#   not depend on this VPS (not the on-box ntfy).
# Healthchecks / Uptime Kuma push URLs: set the URL only (plain GET).
#
# The heartbeat is REQUIRED for a set-and-forget host: every other alert in the
# scaffold originates on the box, so "the box is down" is invisible without it.
# Provisioning fails when the URL is empty unless the gap is explicitly
# accepted with notify_deadman_accept_none: true.
notify_deadman_url: ""
notify_deadman_token: ""
notify_deadman_interval_min: 5
notify_deadman_accept_none: false

# Accept a box with NO on-box alerting (ntfy unset). Like the deadman gate,
# provisioning fails on an empty notify_ntfy_url unless this is explicitly true.
notify_alerts_accept_none: false

# On-box watchers — the "who watches the watcher" layer. All alert through
# vps-notify (ntfy) and no-op when notify_ntfy_url is unset.
#
# Disk usage: alerts on threshold transitions (once per crossing, with an
# all-clear), hourly sweep. The slow killer of unattended hosts.
notify_disk_watch_enabled: true
notify_disk_watch_warn_pct: 80
notify_disk_watch_crit_pct: 90

# SQLite integrity: daily read-only quick_check of every SQLite file in the
# Docker volumes; alerts once when a file turns corrupt, with an all-clear when
# it passes again. Detection only — the app (cache) or a restic restore (data)
# does the repair. Schedule is UTC, in the small hours for Australian users and
# clear of the 17:00 reboot window.
notify_sqlite_watch_enabled: true
notify_sqlite_watch_schedule: "*-*-* 18:37:00"

# Container health: unhealthy / restart-looping containers between deploys
# (deploy's --wait only proves health at deploy time). Grace before the first
# alert; cooldown before repeating it.
notify_container_watch_enabled: true
notify_container_watch_interval_min: 5
notify_container_watch_grace_secs: 600
notify_container_watch_cooldown_secs: 21600

# Post-boot report: after any (re)boot — including unattended-upgrades'
# Automatic-Reboot window — confirm the stack came back healthy ("Rebooted
# OK") or page ("Boot check FAILED").
notify_boot_check_enabled: true
notify_boot_check_deadline_secs: 600

# Monthly synthetic alert: end-to-end proof the ntfy→phone chain still works.
notify_selftest_enabled: true

# Weekly security digest: the automated log review (ISM expects logs to be
# REVIEWED, not just retained). SSH abuse, bans, sudo activity, listening-
# socket deltas, container/disk state, patch SLA, web auth denials — one ntfy
# message, plus a dated journal record as review evidence.
notify_log_digest_enabled: true

# Units whose failure should trigger a push (OnFailure=). Only units that exist
# on the host get a drop-in; the rest are skipped. dailyaidecheck failing is the
# AIDE "file integrity changed / scan errored" signal.
notify_onfailure_units:
  - auditd.service
  - docker.service
  - fail2ban.service
  - ssh.service
  - dailyaidecheck.service
  - backup.service
  - backup-verify.service
  - restore-drill.service
  - vuln-scan.service
  - pending-security-updates.service
  - log-export.service
  # Fail-open safety units: if either fails at boot the box runs with Docker's
  # default (unconstrained) container egress, or without swap. Neither has a
  # user-visible symptom, so the failure itself must page.
  - vps-scaffold-docker-firewall.service
  - vps-cryptswap-swapon.service

# Kernel auto-reboot, guarded against crash loops: one automatic reboot per
# fault, then the box stays down and intact until it has proved stable again.
# See /usr/local/bin/vps-panic-guard and notify.env for the tunables.
notify_panic_guard_enabled: true
# Seconds the kernel waits before rebooting itself. Not 1: the panic text has
# to clear the serial console first, and until the crash record below is live
# that console is the only record of the cause.
notify_panic_guard_reboot_secs: 10
# Bitmask of what the kernel prints on top of the panic message: 1 all tasks
# with their stacks, 2 memory information, 4 timers, 8 lock state, 16 ftrace.
# 31 is everything short of replaying the whole log (bit 32), which would
# overflow the record. Applied by vps-panic-guard whether armed or disarmed:
# the information is wanted in both cases.
notify_panic_guard_panic_print: 31
# Automatic reboots allowed per fault before the box is left down for
# inspection. 1 means a crash loop can never happen.
notify_panic_guard_max_reboots: 1
# Uptime that redeems a strike and re-arms the guard.
notify_panic_guard_stable_min: 30
notify_panic_guard_on_oops: true
notify_panic_guard_on_softlockup: true
# On: a storage hang is the failure mode actually seen in the field
# (prod-rch-vps 2026-09-22 — the host kept serving cached pages while every
# disk write blocked for 3.5 h, so nothing panicked and nothing was logged).
# Tasks stuck in D state past hung_task_timeout_secs is exactly that, and it
# raises a real panic, so the crash record captures it and the guard reboots
# once. The cost is a spurious reboot if legitimate I/O ever blocks that long,
# which on a small VPS is itself worth knowing about.
notify_panic_guard_on_hung_task: true

# Crash record: the panic guard's missing half. A panic writes to the console
# and nothing records the console, so the ten-second reboot erased the cause
# of every stop so far. ramoops keeps the kernel's last messages (the panic,
# the backtrace, and with panic_print the task list and memory state) in a
# region of RAM reserved from the kernel's own use; on a KVM guest that region
# normally survives the guest's reboot, and systemd-pstore archives it to
# /var/lib/systemd/pstore early in the next boot, where the hourly log export
# picks it up. vps-crash-record-check reports over ntfy.
#
# The region's address is chosen on the target from /proc/iomem (the top of
# the highest System RAM range below 4 GiB, 1 MiB aligned, clear of the kernel
# image) and recorded in /etc/vps-scaffold/crash-record.env so it is stable
# across runs. The reservation goes on the kernel command line through a GRUB
# fragment and takes effect at the NEXT reboot; the role never reboots, it
# records the requirement and alerts once.
#
# Limits, stated plainly: a power cycle or a provider-side reset never
# preserves RAM, and a hypervisor may clear guest memory on reboot. The first
# scheduled reboot after rollout shows which ("Crash record survives a
# reboot" or "did NOT survive" over ntfy).
notify_crash_record_enabled: true
# Reserved region in MiB. Everything in it is dump space: the record slots.
notify_crash_record_size_mib: 1
# Size of one dump record. The region holds size / record_size records; a
# panic that needs more than one record (the task list is long) takes several
# slots, newest first, and overwrites the oldest when the region is full.
notify_crash_record_record_size_kib: 256
# Console slice. Ubuntu's generic kernel is built without CONFIG_PSTORE_CONSOLE,
# so a console slice would be reserved and never written; it stays 0 unless
# the kernel is built with it. The dump record already holds the console text,
# because the console text IS the kernel log.
notify_crash_record_console_size_kib: 0
# How much of the kernel log a panic dumps into the record (pstore.kmsg_bytes;
# the kernel's default is 10 KiB, which would lose the backtrace under the
# task list). The whole region by default.
notify_crash_record_kmsg_bytes: "{{ notify_crash_record_size_mib | int * 1024 * 1024 }}"
# Kernel log buffer size on the command line (log_buf_len=). The default
# 256 KiB cannot hold the panic message plus the task list of a host running
# twenty containers, and the dump can only save what the buffer still holds.
# Empty leaves the kernel's default.
notify_crash_record_log_buf_len: 1M
# Where update-grub writes the menu; the play reads it back to prove the
# memmap= reservation came through GRUB's $ quoting intact.
notify_crash_record_grub_cfg: /boot/grub/grub.cfg
