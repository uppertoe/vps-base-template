---
# Set-and-forget guardrail: every other alert originates ON this box, so a
# dead host is invisible without an external heartbeat. Fail provisioning
# early rather than let the gap slide in silently.
- name: Require an external dead-man's switch (or an explicit opt-out)
  ansible.builtin.fail:
    msg: >-
      notify_deadman_url is empty. The on-box ntfy cannot report the host
      itself being down; an external heartbeat monitor (Gatus, Healthchecks,
      Uptime Kuma — see roles/notify/defaults/main.yml) is the only alarm for
      total host loss. Set notify_deadman_url in the inventory, or explicitly
      accept the gap with notify_deadman_accept_none: true.
  when:
    - notify_deadman_url | length == 0
    - not (notify_deadman_accept_none | default(false) | bool)
    - not (molecule_test | default(false) | bool)

# Every on-box watcher (disk, container health, boot report, weekly digest,
# self-test) and every OnFailure hook alerts through ntfy. With no URL they all
# no-op silently — a hardened box with a dead alerting layer. Force the decision.
- name: Require an ntfy endpoint (or an explicit opt-out)
  ansible.builtin.fail:
    msg: >-
      notify_ntfy_url is empty. Every on-box alert (disk, container health,
      unit failures, weekly security digest, self-test) routes through ntfy and
      will silently no-op without it. Set notify_ntfy_url in the inventory, or
      explicitly accept a box with no on-box alerting via
      notify_alerts_accept_none: true.
  when:
    - notify_ntfy_url | length == 0
    - not (notify_alerts_accept_none | default(false) | bool)
    - not (molecule_test | default(false) | bool)

- name: Create vps-scaffold config directory
  ansible.builtin.file:
    path: /etc/vps-scaffold
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Install notification scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - vps-notify
    - vps-notify-unit

- name: Install notify@ systemd template (OnFailure handler)
  ansible.builtin.copy:
    src: notify@.service
    dest: /etc/systemd/system/notify@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install notification config (ntfy)
  ansible.builtin.template:
    src: notify.env.j2
    dest: /etc/vps-scaffold/notify.env
    owner: root
    group: root
    mode: "0600"
  no_log: true  # renders NTFY_TOKEN / DEADMAN_TOKEN — never echo under --diff

# External dead-man's switch: the one alerting hole the on-box ntfy model has
# is "the whole host is down". A tiny heartbeat timer pings an external monitor;
# the monitor alarms when the pings stop. Opt-in via notify_deadman_url.
- name: Install dead-man's-switch heartbeat script
  ansible.builtin.copy:
    src: vps-deadman
    dest: /usr/local/bin/vps-deadman
    owner: root
    group: root
    mode: "0755"

- name: Install vps-deadman.service
  ansible.builtin.copy:
    src: vps-deadman.service
    dest: /etc/systemd/system/vps-deadman.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install vps-deadman.timer
  ansible.builtin.template:
    src: vps-deadman.timer.j2
    dest: /etc/systemd/system/vps-deadman.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable and start dead-man's-switch heartbeat
  ansible.builtin.systemd:
    name: vps-deadman.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - notify_deadman_url | length > 0
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']
  tags:
    - molecule-notest

- name: Disable dead-man's-switch heartbeat when unconfigured
  ansible.builtin.systemd:
    name: vps-deadman.timer
    enabled: false
    state: stopped
  when:
    - notify_deadman_url | length == 0
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']
  failed_when: false
  tags:
    - molecule-notest

# On-box watchers: disk thresholds, container health between deploys, the
# post-boot stack report, and the monthly alert-channel self-test. All alert
# through vps-notify, all no-op while notify_ntfy_url is unset.
- name: Install watcher scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - vps-disk-watch
    - vps-container-watch
    - vps-boot-check
    - vps-log-digest

- name: Create watcher state directory
  ansible.builtin.file:
    path: /var/lib/vps-notify
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Install watcher systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - vps-disk-watch.service
    - vps-disk-watch.timer
    - vps-container-watch.service
    - vps-boot-check.service
    - vps-notify-selftest.service
    - vps-notify-selftest.timer
    - vps-log-digest.service
    - vps-log-digest.timer
  notify: Reload systemd

- name: Install vps-container-watch.timer
  ansible.builtin.template:
    src: vps-container-watch.timer.j2
    dest: /etc/systemd/system/vps-container-watch.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable watcher timers
  ansible.builtin.systemd:
    name: "{{ item.unit }}"
    enabled: "{{ item.want }}"
    state: "{{ 'started' if item.want else 'stopped' }}"
    daemon_reload: true
  loop:
    - unit: vps-disk-watch.timer
      want: "{{ notify_disk_watch_enabled | bool }}"
    - unit: vps-container-watch.timer
      want: "{{ notify_container_watch_enabled | bool }}"
    - unit: vps-notify-selftest.timer
      want: "{{ notify_selftest_enabled | bool }}"
    - unit: vps-log-digest.timer
      want: "{{ notify_log_digest_enabled | bool }}"
  when: ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']
  tags:
    - molecule-notest

- name: Enable post-boot health report (runs once per boot)
  ansible.builtin.systemd:
    name: vps-boot-check.service
    enabled: "{{ notify_boot_check_enabled | bool }}"
    daemon_reload: true
  when: ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']
  tags:
    - molecule-notest

- name: Warn if notifications are unconfigured
  ansible.builtin.debug:
    msg: >-
      notify_ntfy_url is empty — push notifications are installed but disabled
      (vps-notify will no-op). Set notify_ntfy_url in the inventory to enable.
  when: notify_ntfy_url | length == 0

# Earlier roles install units with a pending "Reload systemd" handler; flush
# so systemctl sees them NOW — otherwise freshly installed units are missed on
# the first run and the drop-ins below churn on the next (non-idempotence).
- name: Flush pending handlers so new units are visible to systemctl
  ansible.builtin.meta: flush_handlers

- name: Detect which OnFailure target units exist
  ansible.builtin.command: "systemctl cat {{ item }}"
  loop: "{{ notify_onfailure_units }}"
  register: notify_unit_checks
  changed_when: false
  failed_when: false

- name: Build list of existing target units
  ansible.builtin.set_fact:
    notify_existing_units: >-
      {{ notify_unit_checks.results
         | selectattr('rc', 'equalto', 0)
         | map(attribute='item') | list }}

- name: Ensure systemd drop-in directories exist for target units
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ notify_existing_units }}"

- name: Wire OnFailure push notification on target units
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item }}.d/onfailure-notify.conf"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (notify role)
      [Unit]
      OnFailure=notify@%n.service
  loop: "{{ notify_existing_units }}"
  notify: Reload systemd

# Real-time audit -> ntfy bridge. auditd already watches the crown-jewel config
# paths (sshd_config, sudoers, passwd/shadow) in real time, but its events only
# accrue in the audit log -- the daily AIDE sweep would otherwise be first to
# notice, up to 24h later. This dispatcher plugin pushes the high-value, curated
# events to ntfy the instant they happen, complementing (not replacing) AIDE.
# Only meaningful where auditd is present.
- name: Install the audit->ntfy bridge plugin
  ansible.builtin.copy:
    src: audit-notify
    dest: /usr/local/bin/audit-notify
    owner: root
    group: root
    mode: "0755"
  notify: Reload auditd plugins
  when: "'auditd.service' in notify_existing_units"

- name: Register audit-notify as an auditd dispatcher plugin
  ansible.builtin.copy:
    dest: /etc/audit/plugins.d/audit-notify.conf
    owner: root
    group: root
    mode: "0640"
    content: |
      # Managed by Ansible (notify role) -- push high-value audit events to ntfy.
      # See /usr/local/bin/audit-notify.
      active = yes
      direction = out
      path = /usr/local/bin/audit-notify
      type = always
      format = string
  notify: Reload auditd plugins
  when: "'auditd.service' in notify_existing_units"
