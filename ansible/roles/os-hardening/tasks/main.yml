---
# Thin wrapper around the dev-sec.io os_hardening role.
# Skipped automatically inside Docker containers (Molecule tests) because
# kernel-level settings (sysctl) cannot be changed in unprivileged containers.
# On a real VPS these all apply.
#
# See: https://github.com/dev-sec/ansible-collection-hardening/blob/master/roles/os_hardening/README.md

- name: Apply OS hardening via dev-sec.io
  ansible.builtin.include_role:
    name: devsec.hardening.os_hardening
  vars:
    # Harden /tmp and /var/tmp as size-capped tmpfs so the CIS partition_for_tmp
    # and mount_option_tmp_* / mount_option_var_tmp_* rules pass on a single-disk
    # cloud image. /dev/shm is already hardened by devsec defaults.
    os_mnt_tmp_enabled: "{{ oshardening_harden_tmp_mount }}"
    os_mnt_tmp_src: tmpfs
    os_mnt_tmp_filesystem: tmpfs
    os_mnt_tmp_options: "rw,nosuid,nodev,noexec,size={{ oshardening_tmp_tmpfs_size }}"
    os_mnt_var_tmp_enabled: "{{ oshardening_harden_tmp_mount }}"
    os_mnt_var_tmp_src: tmpfs
    os_mnt_var_tmp_filesystem: tmpfs
    os_mnt_var_tmp_options: "rw,nosuid,nodev,noexec,size={{ oshardening_var_tmp_tmpfs_size }}"
  when: ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']

# devsec only manages mounts whose path already IS a mountpoint (plus a
# hardcoded allowance for /tmp) — on a single-disk image it therefore writes
# the /tmp fstab entry but silently skips /var/tmp entirely. Own /var/tmp
# here: fstab entry + immediate mount (safe — this module's payload lives in
# /tmp, which this mount does not touch).
- name: Configure and mount hardened /var/tmp (devsec skips non-mountpoints)
  ansible.posix.mount:
    path: /var/tmp
    src: tmpfs
    fstype: tmpfs
    opts: "rw,nosuid,nodev,noexec,size={{ oshardening_var_tmp_tmpfs_size }}"
    state: mounted
  when:
    - oshardening_harden_tmp_mount | bool
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']

# Activate the /tmp mount NOW, at a controlled point. devsec defers it to a
# play-end handler, but any service (re)start with PrivateTmp sandboxing —
# timesyncd/auditd/rsyslog postinsts during later apt runs — makes systemd
# pull the generated tmp.mount in as a dependency, remounting /tmp MID-TASK
# and vaporising whatever lives there, including the Ansible module payload
# of the very task that triggered it. Must be a raw command with TMPDIR
# steered away from /tmp: a module mounting /tmp would clobber its own
# payload. "already mounted" tolerance keeps unexpected states non-fatal.
- name: Activate hardened /tmp mount
  ansible.builtin.command:
    cmd: mount /tmp
  environment:
    TMPDIR: /root
  register: oshardening_tmp_mount
  changed_when: oshardening_tmp_mount.rc == 0
  failed_when:
    - oshardening_tmp_mount.rc != 0
    - "'already mounted' not in (oshardening_tmp_mount.stderr | default(''))"
  when:
    - oshardening_harden_tmp_mount | bool
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']
    - "'/tmp' not in (ansible_facts.mounts | map(attribute='mount') | list)"

- name: Apply safe host networking sysctls
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-vps-scaffold.conf
  loop: "{{ baseline_host_sysctls | dict2items }}"
  when:
    - not molecule_test | default(false) | bool
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']

- name: Enable kernel memory overcommit for Redis-style workloads
  ansible.posix.sysctl:
    name: vm.overcommit_memory
    value: "1"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-vps-scaffold.conf
  when:
    - host_vm_overcommit_memory_enabled | bool
    - not molecule_test | default(false) | bool
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']

- name: Lock root password
  ansible.builtin.user:
    name: root
    password_lock: "{{ lock_root_password }}"

- name: Remove auditd when host auditing is disabled
  ansible.builtin.apt:
    name: auditd
    state: absent
    purge: true
    autoremove: true
  when:
    - not os_auditd_enabled | bool
    - ansible_facts['virtualization_type'] not in ['docker', 'container', 'lxc']
