---
# Scheduled container-image CVE scanning (Trivy) of the RUNNING images.
#
# The Essential Eight / ISM patching model expects *daily* vulnerability
# scanning of internet-facing services, with a 48-hour patch clock for
# critical/exploited vulnerabilities. The scheduled scan is what starts that
# clock: it runs Trivy over every image actually running on the VPS, keeps a
# dated report under /var/lib/vuln-scan (SLA evidence), and pushes an urgent
# ntfy alert when a CRITICAL CVE with an available fix is present.
#
# Report-only: an unfixable upstream CVE must never block operations. The
# ad-hoc audit-vuln.yml playbook uses the same approach and additionally
# fetches artifacts into the repo's reports/ directory.
vuln_scan_enabled: true

# When to scan (systemd OnCalendar, UTC). Daily, offset from the backup and
# AIDE timers so the 2 GB box never runs two heavy jobs at once.
vuln_scan_schedule: "*-*-* 05:41:00"

# Severities to record in reports. Alerts only fire for fixable CRITICALs.
vuln_scan_severity: "HIGH,CRITICAL"

# Self-heal grace: how many days a fixable CRITICAL may sit before the urgent
# ntfy alert fires. The hands-off update pipeline (weekly app-image rebuilds →
# Renovate digest PRs → auto-deploy timer) normally clears findings without an
# operator, so paging on day one is pure alert fatigue; paging after the
# pipeline has demonstrably failed is actionable. Findings still appear in the
# dated summary (and start their SLA clock) the day they are found — the grace
# gates the page, not the record. Set to 0 to page immediately (strict
# Essential Eight 48-hour posture: also move the app-repo rebuild schedules
# from weekly to daily so the pipeline can actually meet the clock).
vuln_scan_alert_grace_days: 8

# Trivy runs as a container so nothing is installed on the host. It mounts the
# Docker socket, so pin the scanner image by digest like any other privileged
# helper image.
vuln_scan_trivy_image: "aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f"

# Vulnerability DB cache (shared with audit-vuln.yml) and report retention.
vuln_scan_cache_dir: /var/cache/trivy
vuln_scan_state_dir: /var/lib/vuln-scan
vuln_scan_report_retention_days: 400
