---
# site-first-run.yml — fuller first-run/compliance pass, run as the deploy user
#
# This is the explicit "first run" mode. It enables slower maintenance tasks
# that help establish a stronger initial compliance baseline.
#
# Usage:
#   ansible-playbook -i ansible/inventory/myserver ansible/site-first-run.yml

- name: Configure server (first-run mode)
  hosts: all
  gather_facts: true
  become: true
  # Run pending handlers even if a later task fails the play. A config task that
  # notifies a restart handler (e.g. docker daemon.json -> Restart docker) would
  # otherwise lose it on failure: queued handlers are dropped, and the next
  # (now-unchanged) run won't re-notify -- so the change is written but never
  # applied. RCA: an interrupted first run left userland-proxy:false unapplied,
  # leaving a stale docker-proxy that broke host->container loopback publishing.
  force_handlers: true
  vars:
    common_run_safe_upgrade: true
    baseline_initialize_aide_database: true
  roles:
    - role: common
      tags: [common, baseline]
    # deploy-user runs here too (not just bootstrap) so access-model changes —
    # e.g. flipping deploy_restricted_mode — apply on a normal site run.
    - role: deploy-user
      tags: [access, deploy-user]
    - role: ssh-hardening
      tags: [hardening, ssh]
    - role: os-hardening
      tags: [hardening, os]
    - role: docker
      tags: [docker]
    - role: vuln-scan
      tags: [docker, vuln-scan]
    - role: baseline-hardening
      tags: [hardening, baseline]
    - role: firewall
      tags: [firewall]
    # notify goes LAST: it detects installed units to wire OnFailure hooks,
    # so every unit-installing role must have run before it.
    - role: log-export
      tags: [logging, log-export]
    - role: notify
      tags: [notify]

  # Record which scaffold commit this play applied. vps-deploy and the weekly
  # scaffold-drift check compare it with the checked-out submodule and nag via
  # ntfy while they differ -- host-layer changes (roles, timers, scripts) only
  # land on a play, and Renovate's automatic pointer bumps otherwise hide that.
  post_tasks:
    - name: Record the scaffold commit applied by this play
      ansible.builtin.copy:
        dest: /var/lib/vps-site-applied
        # -c safe.directory=*: on-box runs execute as admin against a checkout
        # owned by the deploy user, which git otherwise refuses ("dubious
        # ownership") and the marker would read "unknown".
        content: "{{ lookup('pipe', 'git -c safe.directory=* -C ' ~ playbook_dir ~ ' rev-parse HEAD 2>/dev/null || echo unknown') }}\n"
        owner: root
        group: root
        mode: "0644"
      tags: [always]
