---
# site-quick.yml — fast day-to-day apply path, run as the deploy user
#
# This is the explicit "quick apply updates" mode. It keeps slower
# maintenance/compliance steps disabled so routine re-runs stay fast.
#
# Usage:
#   ansible-playbook -i ansible/inventory/myserver ansible/site-quick.yml

- name: Configure server (quick apply mode)
  hosts: all
  gather_facts: true
  become: true
  # Run pending handlers even if a later task fails the play, so a config change
  # that notifies a restart handler is never left written-but-unapplied. See the
  # fuller rationale in site-first-run.yml.
  force_handlers: true
  vars:
    common_run_safe_upgrade: false
    baseline_initialize_aide_database: false
  roles:
    - role: common
      tags: [common, baseline]
    # deploy-user runs here too (not just bootstrap) so access-model changes —
    # e.g. flipping deploy_restricted_mode — apply on a normal site run.
    - role: deploy-user
      tags: [access, deploy-user]
    - role: ssh-hardening
      tags: [hardening, ssh]
    - role: os-hardening
      tags: [hardening, os]
    - role: docker
      tags: [docker]
    - role: vuln-scan
      tags: [docker, vuln-scan]
    - role: baseline-hardening
      tags: [hardening, baseline]
    - role: firewall
      tags: [firewall]
    # notify goes LAST: it detects installed units to wire OnFailure hooks,
    # so every unit-installing role must have run before it.
    - role: log-export
      tags: [logging, log-export]
    - role: notify
      tags: [notify]

  # Record which scaffold commit this play applied. vps-deploy and the weekly
  # scaffold-drift check compare it with the checked-out submodule and nag via
  # ntfy while they differ -- host-layer changes (roles, timers, scripts) only
  # land on a play, and Renovate's automatic pointer bumps otherwise hide that.
  post_tasks:
    # The controller-side lookup works for laptop runs. An on-box run as admin
    # cannot read the deploy-owned .git, so fall back to a privileged read of
    # the very checkout the play ran from (playbook_dir is inside it).
    - name: Read the scaffold commit this play ran from (controller)
      ansible.builtin.set_fact:
        site_applied_commit: "{{ lookup('pipe', 'git -c safe.directory=* -C ' ~ playbook_dir ~ ' rev-parse HEAD 2>/dev/null || echo unknown') }}"
      tags: [always]

    - name: Read the scaffold commit this play ran from (target, privileged fallback)
      ansible.builtin.command:
        cmd: "git -c safe.directory=* -C {{ playbook_dir }} rev-parse HEAD"
      register: site_applied_commit_target
      changed_when: false
      failed_when: false
      when: site_applied_commit == 'unknown'
      tags: [always]

    - name: Record the scaffold commit applied by this play
      ansible.builtin.copy:
        dest: /var/lib/vps-site-applied
        content: "{{ (site_applied_commit_target.stdout | default('') | trim) if (site_applied_commit == 'unknown' and (site_applied_commit_target.rc | default(1)) == 0) else site_applied_commit }}\n"
        owner: root
        group: root
        mode: "0644"
      tags: [always]

    # A play legitimately rewrites monitored files (/usr/local/{bin,sbin}
    # scripts, unit files, apt fragments); without this the next nightly AIDE
    # check pages on every play. Same debounced re-baseline a deploy uses;
    # a no-op where the baseline-hardening stack is absent.
    - name: Re-baseline AIDE after the play
      ansible.builtin.systemd:
        name: aide-rebaseline-after-deploy.timer
        state: restarted
      failed_when: false
      tags: [always]
