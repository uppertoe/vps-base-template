---
# site-quick.yml — fast day-to-day apply path, run as the deploy user
#
# This is the explicit "quick apply updates" mode. It keeps slower
# maintenance/compliance steps disabled so routine re-runs stay fast.
#
# Usage:
#   ansible-playbook -i ansible/inventory/myserver ansible/site-quick.yml

- name: Configure server (quick apply mode)
  hosts: all
  gather_facts: true
  become: true
  # Run pending handlers even if a later task fails the play, so a config change
  # that notifies a restart handler is never left written-but-unapplied. See the
  # fuller rationale in site-first-run.yml.
  force_handlers: true
  vars:
    common_run_safe_upgrade: false
    baseline_initialize_aide_database: false
  roles:
    - role: common
      tags: [common, baseline]
    # deploy-user runs here too (not just bootstrap) so access-model changes —
    # e.g. flipping deploy_restricted_mode — apply on a normal site run.
    - role: deploy-user
      tags: [access, deploy-user]
    - role: ssh-hardening
      tags: [hardening, ssh]
    - role: os-hardening
      tags: [hardening, os]
    - role: docker
      tags: [docker]
    - role: vuln-scan
      tags: [docker, vuln-scan]
    - role: baseline-hardening
      tags: [hardening, baseline]
    - role: firewall
      tags: [firewall]
    # notify goes LAST: it detects installed units to wire OnFailure hooks,
    # so every unit-installing role must have run before it.
    - role: log-export
      tags: [logging, log-export]
    - role: notify
      tags: [notify]
