---
# caddy.base.yml — base Caddy service definition
#
# Included by server repos via:
#
#   include:
#     - scaffold/docker/caddy.base.yml
#
# Caddy discovers routing automatically by appending all *.caddy files
# from apps/*/ at container startup. Adding an app requires no changes to
# this file or the Caddyfile — just drop a .caddy file in the app directory.
#
# Environment variables (from server .env):
#   DOMAIN      → primary domain, available as {$DOMAIN} in caddy snippets
#   ACME_EMAIL  → Let's Encrypt registration email (optional)

services:
  # One-shot volume initialiser: fresh named volumes are created root-owned
  # (the caddy image ships /data, /config and no /var/log/caddy at all), so the
  # non-root hardened caddy below cannot write TLS material or access logs on a
  # first provision — the log FileWriter is a hard config-load failure. Runs as
  # root with exactly the two capabilities chown needs, then exits.
  caddy-init:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: "no"
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 64m
    pids_limit: 32
    network_mode: none
    entrypoint: ["/bin/sh", "-c", "chown -R 1000:1000 /data /config /var/log/caddy"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  caddy:
    # Pinned by digest (multi-arch index). Renovate bumps the digest; the :2-alpine
    # tag is kept for human readability. See scaffold/docs/08-security-model.md.
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      caddy-init:
        condition: service_completed_successfully
    read_only: true
    # CIS Docker §5 runtime hardening. The caddy image runs as root by default;
    # run non-root and bind 80/443 via the single retained capability.
    user: "1000:1000"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # bind privileged ports 80/443 as non-root
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 256
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    volumes:
      # Mount repo root so the glob can reach apps/*/*.caddy
      - ../..:/srv/repo:ro
      # Caddyfile mounted explicitly for clarity
      - ../../Caddyfile:/etc/caddy/Caddyfile:ro
      - ./run-caddy.sh:/usr/local/bin/run-caddy.sh:ro
      - caddy_data:/data          # TLS certs — persisted across restarts
      - caddy_config:/config      # Autosave + runtime config cache
      - caddy_logs:/var/log/caddy
    tmpfs:
      - /tmp
    networks:
      - caddy
    environment:
      - DOMAIN=${DOMAIN}
      # Let's Encrypt contact (optional but recommended; enables expiry notices).
      # Without it Caddy registers a bogus contact that LE rejects. From .env.
      - ACME_EMAIL=${ACME_EMAIL:-}
    command: ["/bin/sh", "/usr/local/bin/run-caddy.sh"]
    healthcheck:
      # Read the body to completion (-O /dev/null), don't --spider it: spider
      # closes the socket after headers, before Caddy finishes streaming the
      # /config/ JSON, so every probe logged a write "broken pipe" admin.api
      # error. Same health semantics (exit 0 only on 200), no log spam.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  caddy:
    name: caddy  # fixed name so app containers can join it

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
