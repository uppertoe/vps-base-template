# Sveltia CMS GitHub OAuth relay (sveltia-cms-auth) — template app.
#
# Copy this directory to apps/cms-auth/ in your server repo, then follow
# docker/cms-auth/README.md. PUBLIC endpoint at cms-auth.<DOMAIN>: GitHub
# redirects the browser here after login, so it CANNOT sit behind the login
# wall. Security is GitHub OAuth itself plus the relay's postMessage origin
# allow-list (ALLOWED_ORIGINS in ./.env). Holds the OAuth App client secret;
# publishes no ports; Caddy reaches it over the generated cms-auth_proxy
# network. ONE relay serves every Sveltia site in the estate.
services:
  cms-auth:
    # Pin the digest from the image's registry (Renovate keeps it current):
    #   docker buildx imagetools inspect ghcr.io/uppertoe/sveltia-cms-auth:latest
    image: ghcr.io/uppertoe/sveltia-cms-auth:latest@sha256:36d64beb8b7fb8c0f6f2421d040c5e811d58ebe2657d02bdebc0ffb3107145de
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false # keep `docker compose config` valid in CI without a real .env
    environment:
      # BASE_URL must equal the GitHub OAuth App's callback host (see .env.example).
      - BASE_URL=https://cms-auth.${DOMAIN}
    # --- CIS Docker §5 ---
    user: "65532:65532"        # distroless nonroot; the relay writes nothing
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 64m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # NOTE: no published ports — only Caddy may reach the service.
