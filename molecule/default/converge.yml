---
# converge.yml — applies all roles to the test container
#
# Uses a fixture SSH key path so Molecule exercises the same
# ansible_ssh_private_key_file -> .pub lookup used during real provisioning.

- name: Converge
  hosts: all
  gather_facts: true
  become: true
  serial: 1
  vars:
    ansible_ssh_private_key_file: "{{ playbook_dir }}/fixtures/id_ed25519_molecule"
    # Converge in RESTRICTED mode: CI continuously proves the target access
    # posture (wrapper-only sudo, no docker group for deploy, admin account).
    # Production default remains false until proven on the real VPS (docs/05).
    deploy_restricted_mode: true
    # Exercise the signed-deploy trust store (allowed-signers file, web-flow
    # key fetch + import) with a throwaway key.
    deploy_verify_signature: true
    deploy_allowed_signers:
      - "molecule@example.invalid ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPMtNWyG0zp9l3S105PF90MMk2BlIHeKeIHYsCO3RGPb"
  pre_tasks:
    - name: Mark this as a Molecule test run (disables kernel-level hardening)
      ansible.builtin.set_fact:
        molecule_test: true
  roles:
    - role: common
    - role: deploy-user
    - role: ssh-hardening
    - role: os-hardening
    - role: baseline-hardening
    - role: docker
    - role: vuln-scan
    - role: firewall
    - role: log-export
    - role: notify
