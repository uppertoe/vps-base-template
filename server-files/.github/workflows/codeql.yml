name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 21 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    # CodeQL code scanning needs GitHub Advanced Security on private repos.
    # Deployments created from this template are private (and typically on the
    # free plan without GHAS), where this job cannot run and fails on every
    # push/PR. Gate it to the public template repo so it scans here and is
    # skipped (neutral, not failed) in every private fork — no per-repo cleanup.
    if: github.repository == 'uppertoe/server-instance-template'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
