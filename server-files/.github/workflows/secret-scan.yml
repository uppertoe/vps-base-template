name: Secret Scan

# This repo is the live config for a box: a committed credential is an
# immediate compromise. On a free-plan private repo GitHub's push protection
# is not available, and most commits to main are direct operator pushes, so
# every push to main and every PR is scanned, inside CI's Static Checks job
# (a job of its own would be billed a whole minute for a scan of seconds).
# This workflow keeps the weekly and on-demand runs. The job lives in the
# scaffold (scaffold/.github/workflows/server-secret-scan.yml).

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    uses: uppertoe/vps-base-template/.github/workflows/server-secret-scan.yml@SCAFFOLD_COMMIT
